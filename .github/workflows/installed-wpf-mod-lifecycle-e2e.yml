name: Installed WPF Mod Lifecycle Acceptance

# This workflow runs only on disposable hosted Windows, never a personal desktop.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/MhwModManager.IntegrationTests/InstalledWpfModLifecycleE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/InstalledWpfModLifecycleE2ETests.*.cs'
      - 'tests/MhwModManager.IntegrationTests/DiscoveredGameProfiles.cs'
      - 'tests/fixtures/discovered-games/**'
      - 'tests/fixtures/packaged-ui/**'
      - 'scripts/diagnostics/**'
      - 'src/MhwModManager.App/**'
      - 'src/MhwModManager.Core/GameProfiles.cs'
      - 'src/MhwModManager.Filesystem/GameProfileRegistry*.cs'
      - 'tests/MhwModManager.IntegrationTests/InstalledWpfAcceptanceContractTests.cs'
      - 'src/MhwModManager.App/MainWindow.xaml'
      - 'src/MhwModManager.App/MainWindow.xaml.cs'
      - 'src/MhwModManager.App/ViewModels/MainWindowViewModel.AutoSort.cs'
      - 'src/MhwModManager.App/ViewModels/MainWindowViewModel.Import.cs'
      - 'src/MhwModManager.Automation/GameModIntakeService.cs'
      - 'src/MhwModManager.Automation/GameModIntakeClassifier.cs'
      - 'src/MhwModManager.Automation/ModBoundaryDiscovery.cs'
      - 'src/MhwModManager.Automation/SmartInboxService.cs'
      - 'src/MhwModManager.Automation/ArchiveImportService.cs'
      - 'src/MhwModManager.Core/UnrealPakLayout.cs'
      - 'src/MhwModManager.Filesystem/ModScanner.cs'
      - 'src/MhwModManager.Filesystem/BepInExPluginMetadata.cs'
      - 'tests/MhwModManager.IntegrationTests/BepInExPluginLibraryTests.cs'
      - 'src/MhwModManager.Filesystem/LocalModInventory.cs'
      - 'src/MhwModManager.App/ViewModels/MainWindowViewModel.cs'
      - 'src/MhwModManager.App/ViewModels/MainWindowViewModel.LocalInventory.cs'
      - 'src/MhwModManager.Filesystem/CatalogService.cs'
      - 'src/MhwModManager.Storage/ManagerDatabase.cs'
      - 'src/MhwModManager.App/App.xaml.cs'
      - '.github/workflows/installed-wpf-mod-lifecycle-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installed-wpf-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-wpf:
    name: Actual packaged WPF app with fake game profiles
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      MHW_RUN_INSTALLED_WPF_E2E: '1'
    steps:
      - name: Require disposable hosted Windows namespace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Refusing to exercise installed WPF UI on persistent or personal machine.'
          }
          $local = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if ([string]::IsNullOrWhiteSpace($local) -or -not [IO.Path]::IsPathRooted($local)) {
            throw 'Disposable hosted profile unavailable.'
          }
          $updater = Join-Path $local 'MhwModManager\Updater'
          if (Test-Path -LiteralPath $updater) {
            $item = Get-Item -LiteralPath $updater -Force
            if (-not $item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or
                @(Get-ChildItem -LiteralPath $updater -Force | Select-Object -First 1).Count -gt 0) {
              throw 'Updater state occupied; refusing to modify unrelated data.'
            }
          }

      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Provision pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify SDK and prepare uniquely-owned published executable root
        shell: powershell
        run: |
          .\scripts\ci\Assert-PinnedDotNetSdk.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP ("mhw-wpf-package-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Refusing to overwrite an existing package root.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "MHW_WPF_E2E_PACKAGE_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build strict Windows integration runner
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish candidate app to disposable runner
        shell: powershell
        run: |
          dotnet publish .\src\MhwModManager.App\MhwModManager.App.csproj -c Release --no-restore -o "$env:MHW_WPF_E2E_PACKAGE_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $env:MHW_WPF_E2E_PACKAGE_DIR 'MHW Mod Manager.exe'))) {
            throw 'Published candidate WinExe is missing.'
          }

          $packagedScripts = Join-Path $env:MHW_WPF_E2E_PACKAGE_DIR 'scripts/diagnostics'
          New-Item -ItemType Directory -Force -Path $packagedScripts | Out-Null
          Copy-Item -Path scripts/diagnostics/Capture-Diagnostics.ps1,scripts/diagnostics/Master-Debug.ps1 -Destination $packagedScripts

      - name: Prepare disposable WPF UI evidence and game-launch probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) { throw 'xUnit runner is missing.' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'BuildLogs\installed-wpf-acceptance'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe "/out:$env:RUNNER_TEMP\mhw-game-launch-probe.exe" (Resolve-Path tests/fixtures/packaged-ui/GameLaunchProbe.cs).Path
          if ($LASTEXITCODE -ne 0) { throw 'Disposable game launch probe failed to compile.' }
          "MHW_GAME_UI_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Bright Memory's second-package disable before the full profile matrix
        id: bright_memory
        timeout-minutes: 7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          $class = 'MhwModManager.IntegrationTests.InstalledWpfModLifecycleE2ETests'
          $method = "$class.BrightMemoryInfiniteSecondPackageDisableRegression"
          $output = @(& $runner '--filter-method' $method 2>&1)
          $exit = $LASTEXITCODE
          $output | Add-Content -LiteralPath (Join-Path $env:MHW_GAME_UI_EVIDENCE 'test-run.log') -Encoding UTF8
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Focused Bright Memory WPF regression failed, exit code $exit." }
          $summary = $output -join [Environment]::NewLine
          if ($summary -notmatch 'succeeded:\s+1\b' -or $summary -notmatch 'skipped:\s+0\b') {
            throw 'Focused Bright Memory WPF regression did not execute exactly one passing case.'
          }

      - name: Verify three package picker and saved-choice cases
        id: picker
        timeout-minutes: 12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          $evidence = $env:MHW_GAME_UI_EVIDENCE
          $class = 'MhwModManager.IntegrationTests.InstalledWpfModLifecycleE2ETests'
          $method = "$class.NestedUnrealPackagesRemainSeparateThroughPreviewApplyAndUndo"
          $output = @(& $runner '--filter-method' $method 2>&1)
          $exit = $LASTEXITCODE
          $output | Add-Content -LiteralPath (Join-Path $evidence 'test-run.log') -Encoding UTF8
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Installed WPF picker acceptance failed, exit code $exit." }
          $summary = $output -join [Environment]::NewLine
          if ($summary -notmatch 'succeeded:\s+3\b' -or $summary -notmatch 'skipped:\s+0\b') {
            throw 'Expected three passing picker cases and zero skips.'
          }


      - name: Verify remaining lifecycle cases and all registered game receipts
        if: ${{ !cancelled() && env.MHW_GAME_UI_EVIDENCE != '' && steps.bright_memory.outcome == 'success' && steps.picker.outcome == 'success' }}
        timeout-minutes: 53
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          $evidence = $env:MHW_GAME_UI_EVIDENCE
          $class = 'MhwModManager.IntegrationTests.InstalledWpfModLifecycleE2ETests'
          $method = "$class.NestedUnrealPackagesRemainSeparateThroughPreviewApplyAndUndo"
          $expectedCases = 14
          $remainingCases = $expectedCases - 3
          $focused = "$class.BrightMemoryInfiniteSecondPackageDisableRegression"
          $output = @(& $runner '--filter-class' $class '--filter-not-method' $method '--filter-not-method' $focused 2>&1)
          $exit = $LASTEXITCODE
          $output | Add-Content -LiteralPath (Join-Path $evidence 'test-run.log') -Encoding UTF8
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Installed WPF lifecycle acceptance failed, exit code $exit." }
          $summary = $output -join [Environment]::NewLine
          if ($summary -notmatch "succeeded:\s+$remainingCases\b" -or $summary -notmatch 'skipped:\s+0\b') {
            throw "Expected $remainingCases passing remaining cases and zero skips."
          }
          $inventory = @(Get-Content -Raw -Encoding UTF8 tests/fixtures/discovered-games/games.json | ConvertFrom-Json)
          $gameReceipts = @(Get-ChildItem -LiteralPath $evidence -Filter 'game-*.json' | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          })
          $expectedIds = @($inventory | ForEach-Object { $_.id } | Sort-Object)
          $observedIds = @($gameReceipts | ForEach-Object { $_.Id } | Sort-Object)
          if ($expectedIds.Count -eq 0 -or $observedIds.Count -ne $expectedIds.Count -or
              (Compare-Object $expectedIds $observedIds) -or @($gameReceipts | Where-Object { $_.error }).Count) {
            throw 'The installed UI receipts do not cover every registered fixture profile.'
          }
          $repairedIds = @(Get-ChildItem -LiteralPath $evidence -Filter 'repair-*.json' | ForEach-Object {
            $row = Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($row.error) { throw $row.error }
            $row.Id
          } | Sort-Object)
          if ($repairedIds.Count -ne $expectedIds.Count -or (Compare-Object $expectedIds $repairedIds)) {
            throw 'The move-repair receipts do not cover the registered fixture inventory.'
          }
          $exe = Join-Path $env:MHW_WPF_E2E_PACKAGE_DIR 'MHW Mod Manager.exe'
          if ('${{ steps.picker.outcome }}' -ne 'success') { throw 'The picker checks failed. Per-game receipts were retained without a passing release proof.' }
          $proof = [ordered]@{
            schemaVersion = 1
            sourceSha = (& git rev-parse HEAD).Trim()
            hostedDisposable = $true
            exeSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            verifiedGameProfiles = $observedIds
            succeeded = $expectedCases
            failed = 0
            skipped = 0
          }
          $proofJson = $proof | ConvertTo-Json -Depth 4
          $proofJson | Set-Content -LiteralPath (Join-Path $evidence 'proof.json') -Encoding UTF8
          Write-Host $proofJson

      - name: Retain bounded evidence when artifact quota allows
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: installed-wpf-mod-e2e-${{ github.sha }}-${{ github.run_id }}
          path: BuildLogs/installed-wpf-acceptance/*
          if-no-files-found: warn
          retention-days: 3
