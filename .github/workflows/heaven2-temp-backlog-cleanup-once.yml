name: Heaven2 Temp Backlog Cleanup One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heaven2-temp-backlog-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heaven2-temp-backlog-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    name: Final raw preservation purge
    runs-on: [self-hosted, Windows, X64, heaven-v2]
    timeout-minutes: 20
    steps:
      - name: Preserve exact residual contents and delete stale roots
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          function Format-Bytes([long]$Bytes) {
            if ($Bytes -ge 1GB) { return ('{0:N2} GB' -f ($Bytes/1GB)) }
            if ($Bytes -ge 1MB) { return ('{0:N2} MB' -f ($Bytes/1MB)) }
            if ($Bytes -ge 1KB) { return ('{0:N2} KB' -f ($Bytes/1KB)) }
            return "$Bytes B"
          }
          function Get-TreeBytes([string]$Path) {
            try {
              return [long]((Get-ChildItem -LiteralPath $Path -Force -File -Recurse -ErrorAction SilentlyContinue |
                Measure-Object Length -Sum).Sum)
            } catch { return 0L }
          }

          $tempRoot=[IO.Path]::GetFullPath($env:TEMP).TrimEnd('\')
          $profile=[IO.Path]::GetFullPath($env:USERPROFILE).TrimEnd('\')
          if(-not $tempRoot.StartsWith($profile,[StringComparison]::OrdinalIgnoreCase)){
            throw "Refusing cleanup because TEMP is outside USERPROFILE: $tempRoot"
          }
          $cutoff=[DateTime]::UtcNow.AddHours(-24)
          $namePattern='(?i)^(MhwManagerSelfTest-|MhwAgentControlSelfTest-|mhw-|mhwm-|chatgpt-|agent-control-|shipit-|heaven-toolbox-|DiagOutputDir$)'
          $salvageBase=Join-Path $env:LOCALAPPDATA 'HeavenScratchRecovery\2026-10-03\raw-residual'
          New-Item -ItemType Directory -Force -Path $salvageBase | Out-Null

          $driveId=[IO.Path]::GetPathRoot($tempRoot).TrimEnd('\')
          $diskBefore=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveId'" -ErrorAction SilentlyContinue
          $freeBefore=if($diskBefore){[long]$diskBefore.FreeSpace}else{0L}

          $candidates=@(Get-ChildItem -LiteralPath $tempRoot -Force -Directory -ErrorAction Stop |
            Where-Object {$_.Name -match $namePattern -and $_.LastWriteTimeUtc -lt $cutoff} |
            Sort-Object LastWriteTimeUtc)

          $deleted=New-Object System.Collections.Generic.List[object]
          $skipped=New-Object System.Collections.Generic.List[object]
          [long]$sourceBytes=0
          [long]$archiveBytes=0

          foreach($dir in $candidates){
            $root=[IO.Path]::GetFullPath($dir.FullName).TrimEnd('\')
            $parent=[IO.Path]::GetFullPath((Split-Path -Parent $root)).TrimEnd('\')
            if(-not [string]::Equals($parent,$tempRoot,[StringComparison]::OrdinalIgnoreCase)){
              $skipped.Add([pscustomobject]@{Name=$dir.Name;Reason='not-immediate-child-of-temp'}); continue
            }
            if(($dir.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){
              $skipped.Add([pscustomobject]@{Name=$dir.Name;Reason='root-reparse-point'}); continue
            }
            $nestedReparse=@(Get-ChildItem -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue |
              Where-Object {($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0} |
              Select-Object -First 1)
            if($nestedReparse.Count -gt 0){
              $skipped.Add([pscustomobject]@{Name=$dir.Name;Reason='nested-reparse-point'}); continue
            }

            $bytes=Get-TreeBytes $root
            $zip=$null
            try{
              if($bytes -gt 0){
                $tag=($dir.Name -replace '[^A-Za-z0-9._-]','_')
                if($tag.Length -gt 120){$tag=$tag.Substring(0,120)}
                $zip=Join-Path $salvageBase ($tag+'-'+[Guid]::NewGuid().ToString('N').Substring(0,8)+'.zip')
                [IO.Compression.ZipFile]::CreateFromDirectory($root,$zip,[IO.Compression.CompressionLevel]::Optimal,$true)
                $archive=Get-Item -LiteralPath $zip -ErrorAction Stop
                if($archive.Length -le 0){throw 'raw salvage archive is empty'}
                $opened=[IO.Compression.ZipFile]::OpenRead($zip)
                try{
                  if($opened.Entries.Count -eq 0){throw 'raw salvage archive contains no entries'}
                }finally{$opened.Dispose()}
              }

              $removed=$false
              $lastError=$null
              for($attempt=1;$attempt -le 5;$attempt++){
                try{
                  Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
                  $removed=-not(Test-Path -LiteralPath $root)
                  if($removed){break}
                }catch{$lastError=$_.Exception.Message}
                Start-Sleep -Milliseconds (250*$attempt)
              }
              if(-not $removed){throw "source deletion failed: $lastError"}

              $sourceBytes+=$bytes
              if($zip -and (Test-Path -LiteralPath $zip -PathType Leaf)){
                $archiveBytes+=(Get-Item -LiteralPath $zip).Length
              }
              $deleted.Add([pscustomobject]@{Name=$dir.Name;Bytes=$bytes;Archive=$zip})
              Write-Host ("RAW_PRESERVED_AND_DELETED name='{0}' source='{1}'" -f $dir.Name,(Format-Bytes $bytes))
            }catch{
              $skipped.Add([pscustomobject]@{Name=$dir.Name;Reason=$_.Exception.Message})
              Write-Host ("FINAL_SKIP name='{0}' reason='{1}'" -f $dir.Name,$_.Exception.Message)
              if($zip -and (Test-Path -LiteralPath $zip -PathType Leaf)){
                try{$opened=[IO.Compression.ZipFile]::OpenRead($zip);$opened.Dispose()}catch{Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue}
              }
            }
          }

          $remaining=@(Get-ChildItem -LiteralPath $tempRoot -Force -Directory -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match $namePattern -and $_.LastWriteTimeUtc -lt $cutoff})
          [long]$remainingBytes=0
          foreach($row in $remaining){$remainingBytes+=Get-TreeBytes $row.FullName}
          $diskAfter=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveId'" -ErrorAction SilentlyContinue
          $freeAfter=if($diskAfter){[long]$diskAfter.FreeSpace}else{0L}
          $freeDelta=[Math]::Max(0L,$freeAfter-$freeBefore)

          $bodyLines=New-Object System.Collections.Generic.List[string]
          $bodyLines.Add('## Heaven2 final residual temp purge')
          $bodyLines.Add('')
          $bodyLines.Add("- Raw-preserved then deleted: **$($deleted.Count)** roots / **$(Format-Bytes $sourceBytes)** source")
          $bodyLines.Add("- Added recovery archives: **$(Format-Bytes $archiveBytes)** under $salvageBase")
          $bodyLines.Add("- Net disk free-space increase: **$(Format-Bytes $freeDelta)**")
          $bodyLines.Add("- Still skipped: **$($skipped.Count)**")
          $bodyLines.Add("- Remaining stale allowlisted temp: **$($remaining.Count)** / **$(Format-Bytes $remainingBytes)**")
          if($skipped.Count -gt 0){
            $bodyLines.Add('');$bodyLines.Add('### Still skipped')
            foreach($row in $skipped){$bodyLines.Add("- $($row.Name): $($row.Reason)")}
          }
          $bodyLines.Add('')
          $bodyLines.Add('Any non-empty residual root was copied byte-for-byte into a verified local ZIP before its temp directory was removed. Reparse-point trees remain fail-closed.')
          $body=[string]::Join([Environment]::NewLine,$bodyLines)
          if($env:GITHUB_STEP_SUMMARY){Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $body}

          Write-Host "FINAL_DELETED_COUNT=$($deleted.Count)"
          Write-Host "FINAL_SOURCE_BYTES=$(Format-Bytes $sourceBytes)"
          Write-Host "FINAL_ARCHIVE_BYTES=$(Format-Bytes $archiveBytes)"
          Write-Host "FINAL_FREE_DELTA=$(Format-Bytes $freeDelta)"
          Write-Host "FINAL_REMAINING_COUNT=$($remaining.Count)"
          Write-Host "FINAL_REMAINING_BYTES=$(Format-Bytes $remainingBytes)"

          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='heaven2-temp-final-purge'
          }
          $payload=@{body=$body}|ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/fengie/mhw-mods/issues/665/comments' -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
