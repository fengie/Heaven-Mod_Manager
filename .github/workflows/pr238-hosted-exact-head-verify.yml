name: PR238 hosted exact-head verify

on:
  push:
    branches:
      - fix/agent-control-self-install-shortcut-20260929

permissions:
  contents: read

concurrency:
  group: pr238-hosted-exact-head-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Agent Control checks
        working-directory: tools/agent-control
        run: |
          npm run check
          npm test

      - name: Parse shortcut installer PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/agent-control/Install-AgentControlShortcut.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
