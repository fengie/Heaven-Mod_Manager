name: Heaven AutoUpdate Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-autoupdate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    # MHW's dedicated Heaven runner is repo-scoped; Toolbox's persistent runner is not.
    # Never execute fork-supplied private PR workflows on the persistent Windows host.
    if: github.event.repository.private == false || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows","X64","mhw-mods"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind exact update-policy source (Windows)
        if: github.event.repository.private == true
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA -or $actual -cnotmatch '^[a-f0-9]{40}$') { throw 'SOURCE_REVISION_MISMATCH' }
          "HEAVEN_AUTOUPDATE_SOURCE_VERIFIED $actual"
      - name: Bind exact update-policy source (Linux)
        if: github.event.repository.private == false
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA -or $actual -cnotmatch '^[a-f0-9]{40}$') { throw 'SOURCE_REVISION_MISMATCH' }
          "HEAVEN_AUTOUPDATE_SOURCE_VERIFIED $actual"
      - name: Enforce automatic update contract (Windows)
        if: github.event.repository.private == true
        shell: powershell
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: .\scripts\ci\Verify-HeavenRepoPolicy.ps1
      - name: Enforce automatic update contract (Linux)
        if: github.event.repository.private == false
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: ./scripts/ci/Verify-HeavenRepoPolicy.ps1
      - name: Test source-update scalars (Windows)
        if: github.event.repository.private == true
        shell: powershell
        run: .\scripts\ci\Test-HeavenRepoPolicyScalars.ps1
      - name: Test source-update scalars (Linux)
        if: github.event.repository.private == false
        shell: pwsh
        run: ./scripts/ci/Test-HeavenRepoPolicyScalars.ps1
