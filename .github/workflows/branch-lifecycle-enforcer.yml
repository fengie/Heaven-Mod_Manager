# Permanent repository policy enforcement. Temporary task branches are disposable only after canonical integration is proven.
name: Branch Lifecycle Enforcer

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-lifecycle-enforcer
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    steps:
      - name: Enforce merged-branch setting and clean proven-safe branches
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const protectedNames = new Set(["main", "heaven-bridge"]);
            const deleted = [];
            const preserved = [];
            const failures = [];
            let deferred = null;

            const isRateLimit = error =>
              error?.status === 403 &&
              (
                String(error?.message || "").toLowerCase().includes("rate limit") ||
                String(error?.response?.headers?.["x-ratelimit-remaining"] || "") === "0"
              );

            // Branch cleanup is hygiene, not a reason to burn the last API requests.
            // Defer cleanly when the installation-wide core quota is already depleted.
            const rate = await github.rest.rateLimit.get();
            const coreRate = rate.data.resources?.core;
            if (coreRate && coreRate.remaining < 250) {
              deferred = {
                reason: "github-core-rate-limit-low",
                remaining: coreRate.remaining,
                reset: coreRate.reset
              };
              core.warning(
                `Deferring branch cleanup: GitHub core API quota is low (${coreRate.remaining} remaining).`
              );
              await core.summary
                .addHeading("Branch lifecycle enforcement")
                .addCodeBlock(JSON.stringify({ deferred, deleted, preserved, failures }, null, 2), "json")
                .write();
              return;
            }

            const info = await github.rest.repos.get({ owner, repo });
            if (info.data.default_branch !== "main") {
              core.setFailed(`Default branch is ${info.data.default_branch}; refusing branch cleanup`);
              return;
            }

            const deleteBranchOnMerge = Boolean(info.data.delete_branch_on_merge);
            if (!deleteBranchOnMerge) {
              core.warning(
                "GitHub native 'Automatically delete head branches' is not enabled. " +
                "This workflow will still clean proven-safe branches, but repository-admin remediation remains recommended."
              );
            }

            // Fetch shared state once. The previous implementation re-fetched branch,
            // PR, and main-ref state per branch and could exhaust the installation quota.
            const [branches, openPulls, closedPulls, mainRef] = await Promise.all([
              github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 }),
              github.paginate(github.rest.pulls.list, { owner, repo, state: "closed", base: "main", per_page: 100 }),
              github.rest.git.getRef({ owner, repo, ref: "heads/main" })
            ]);

            const mainSha = mainRef.data.object.sha;
            const openByHead = new Map();
            for (const pr of openPulls) {
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              const list = openByHead.get(pr.head.ref) || [];
              list.push(pr);
              openByHead.set(pr.head.ref, list);
            }

            const mergedByHead = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at || !pr.merge_commit_sha) continue;
              if (pr.head?.repo?.full_name !== `${owner}/${repo}`) continue;
              const list = mergedByHead.get(pr.head.ref) || [];
              list.push(pr);
              mergedByHead.set(pr.head.ref, list);
            }

            for (const branchInfo of branches) {
              const branch = branchInfo.name;
              const branchSha = branchInfo.commit?.sha;

              if (protectedNames.has(branch)) {
                preserved.push({ branch, sha: branchSha, reason: "reserved-branch" });
                continue;
              }
              if (branchInfo.protected) {
                preserved.push({ branch, sha: branchSha, reason: "protected" });
                continue;
              }

              const open = openByHead.get(branch) || [];
              if (open.length) {
                preserved.push({ branch, sha: branchSha, reason: `open-pr-${open[0].number}` });
                continue;
              }

              let safe = false;
              let reason = "unique-or-unproven";

              try {
                const ancestry = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branchSha}...${mainSha}`
                });
                if (ancestry.data.behind_by === 0) {
                  safe = true;
                  reason = "tip-ancestor-of-main";
                }
              } catch (error) {
                if (isRateLimit(error)) {
                  deferred = { reason: "github-core-rate-limit-exhausted", branch };
                  core.warning(`Deferring remaining branch cleanup after rate-limit exhaustion at ${branch}.`);
                  break;
                }
                preserved.push({
                  branch,
                  sha: branchSha,
                  reason: `ancestry-check-failed:${error.status || "unknown"}`
                });
                continue;
              }

              if (!safe) {
                for (const pr of (mergedByHead.get(branch) || [])) {
                  if (pr.head?.sha !== branchSha) continue;
                  try {
                    const reachability = await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${pr.merge_commit_sha}...${mainSha}`
                    });
                    if (reachability.data.behind_by === 0) {
                      safe = true;
                      reason = `merged-pr-${pr.number}`;
                      break;
                    }
                  } catch (error) {
                    if (isRateLimit(error)) {
                      deferred = { reason: "github-core-rate-limit-exhausted", branch };
                      break;
                    }
                    preserved.push({
                      branch,
                      sha: branchSha,
                      reason: `merge-reachability-check-failed:${error.status || "unknown"}`
                    });
                  }
                }
                if (deferred) break;
              }

              if (!safe) {
                preserved.push({ branch, sha: branchSha, reason });
                continue;
              }

              // Race guard: delete only if the branch still points at the SHA we proved safe.
              try {
                const latest = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
                if (latest.data.object.sha !== branchSha) {
                  preserved.push({
                    branch,
                    sha: latest.data.object.sha,
                    reason: "moved-during-audit"
                  });
                  continue;
                }

                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                deleted.push({ branch, sha: branchSha, reason });
              } catch (error) {
                if (error.status === 404) {
                  preserved.push({ branch, sha: branchSha, reason: "already-absent" });
                  continue;
                }
                if (isRateLimit(error)) {
                  deferred = { reason: "github-core-rate-limit-exhausted", branch };
                  core.warning(`Deferring remaining branch cleanup after rate-limit exhaustion at ${branch}.`);
                  break;
                }
                failures.push({
                  branch,
                  sha: branchSha,
                  reason: `delete-failed:${error.status || error.message || "unknown"}`
                });
              }
            }

            await core.summary
              .addHeading("Branch lifecycle enforcement")
              .addCodeBlock(JSON.stringify({
                deleteBranchOnMerge,
                deferred,
                deleted,
                preserved,
                failures,
                observedBranchCount: branches.length,
                estimatedRemainingBranchCount: branches.length - deleted.length
              }, null, 2), "json")
              .write();

            if (failures.length) {
              core.setFailed(`Failed to delete ${failures.length} branch(es) that were proven safe.`);
            }
