name: Heaven2 Identity Probe One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heaven2-identity-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe logical host identity
    runs-on: [self-hosted, Windows, X64, heaven-v2]
    timeout-minutes: 5
    steps:
      - name: Read local host evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          Write-Host "USERPROFILE=$env:USERPROFILE"

          $localHeartbeatPath = Join-Path $env:USERPROFILE 'HeavenBridge\worker-local-heartbeat.json'
          if (Test-Path -LiteralPath $localHeartbeatPath -PathType Leaf) {
            $local = Get-Content -LiteralPath $localHeartbeatPath -Raw | ConvertFrom-Json
            Write-Host ("LOCAL_HEARTBEAT=" + ($local | ConvertTo-Json -Compress -Depth 5))
          } else {
            Write-Host "LOCAL_HEARTBEAT=MISSING"
          }

          foreach ($name in @(
            'Heaven Local Bridge',
            'Heaven Local Bridge Watchdog',
            'Heaven Local Bridge Sentinel',
            'Heaven Local Bridge Request Ingress',
            'Heaven Agent Control',
            'Heaven Agent Control Watchdog'
          )) {
            try {
              $task = Get-ScheduledTask -TaskName $name -ErrorAction Stop
              Write-Host ("TASK name='{0}' state='{1}' user='{2}' runlevel='{3}'" -f $name,$task.State,$task.Principal.UserId,$task.Principal.RunLevel)
            } catch {
              Write-Host ("TASK name='{0}' state='MISSING'" -f $name)
            }
          }

          $procs = @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.CommandLine -and (
                  $_.CommandLine -like '*heaven-desktop-worker.py*' -or
                  $_.CommandLine -like '*request-ingress.mjs*' -or
                  $_.CommandLine -like '*agent-control*server.mjs*'
                )
              } |
              Select-Object ProcessId,Name,CommandLine
          )
          foreach ($proc in $procs) {
            $safe = ([string]$proc.CommandLine) -replace '(?i)(token|secret|password|key)=\S+','$1=<redacted>'
            Write-Host ("PROC pid={0} name='{1}' cmd='{2}'" -f $proc.ProcessId,$proc.Name,$safe)
          }

          $toolbox = Join-Path $env:USERPROFILE 'local-ai-workspaces\heaven-toolbox'
          Write-Host ("TOOLBOX_EXISTS=" + (Test-Path -LiteralPath $toolbox -PathType Container))
          Write-Host ("AGENT_CONTROL_LAUNCHER_EXISTS=" + (Test-Path -LiteralPath (Join-Path $toolbox 'tools\agent-control\Start Agent Control.bat') -PathType Leaf))
          Write-Host ("WORK_REPORTS_LAUNCHER_EXISTS=" + (Test-Path -LiteralPath (Join-Path $toolbox 'plugins\agent-work-reports\Start Agent Work Reports.bat') -PathType Leaf))
