name: One-shot archive replay and family topology baseline (2026-11-16)
# Opt-in user-directed one-time execution. No cron, no PR writes, no installed files.
on:
  push:
    branches:
      - bench/run-archive-replay-family-20261116
    paths:
      - '.github/workflows/one-shot-archive-replay-20261116.yml'
permissions:
  contents: read
concurrency:
  group: onetime-archive-replay-family-20261116
  cancel-in-progress: false
jobs:
  measure:
    name: Isolated archive replay and family topology ShortRun
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 90
    steps:
      - name: Check out immutable benchmark source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated writable SDK
        shell: powershell
        run: |
          $sdkRoot=Join-Path $env:RUNNER_TEMP ("dotnet-bench-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          "DOTNET_INSTALL_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provision pinned SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Capture platform and SDK provenance
        shell: powershell
        run: |
          Write-Host "BENCHMARK_SOURCE_SHA=$env:GITHUB_SHA"
          Write-Host "BENCHMARK_RUN_ID=$env:GITHUB_RUN_ID"
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "CPU=$($cpu.Name); cores=$($cpu.NumberOfCores); logical=$($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM_GiB=$([math]::Round($os.TotalVisibleMemorySize/1048576,2))"
          .\scripts\ci\Assert-PinnedDotNetSdk.ps1
      - name: Measure warm duplicate archive replay (8, 64, 256 archives)
        shell: powershell
        timeout-minutes: 38
        run: |
          .\scripts\benchmarks\Run-Benchmarks.ps1 -Filter '*BulkArchiveReplayBenchmarks*' -Job Short
      - name: Measure independent versus shared-root family inference
        shell: powershell
        timeout-minutes: 38
        run: |
          .\scripts\benchmarks\Run-Benchmarks.ps1 -Filter '*FamilyTopologyBenchmarks*' -Job Short
      - name: Retain JSON metrics when artifact storage allows
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: onetime-archive-replay-${{ github.sha }}-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/results/*-full-compressed.json
          if-no-files-found: warn
          retention-days: 3
