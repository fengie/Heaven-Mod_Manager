name: MHW Product Security Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release-gate.yml'
      - '.github/workflows/updater-publication-pr-gate.yml'
      - '.github/workflows/security-supply-chain-gate.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'SECURITY.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-29.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-30.md'
      - 'scripts/release/**'
      - 'scripts/testing/Test-CiSecurityPolicy.ps1'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    paths:
      - '.github/workflows/windows-release-gate.yml'
      - '.github/workflows/updater-publication-pr-gate.yml'
      - '.github/workflows/security-supply-chain-gate.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'SECURITY.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-29.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-30.md'
      - 'scripts/release/**'
      - 'scripts/testing/Test-CiSecurityPolicy.ps1'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'global.json'
      - 'NuGet.config'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mhw-product-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-security:
    name: Verify updater and release security invariants
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 10
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse product security policy
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\scripts\testing\Test-CiSecurityPolicy.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Audit MHW product security policy
        shell: powershell
        run: .\scripts\testing\Test-CiSecurityPolicy.ps1 -Root $env:GITHUB_WORKSPACE
