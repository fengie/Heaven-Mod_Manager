name: Heaven Control Plane Gate

on:
  push:
    branches: [main]
    paths:
      - "plugins/heaven-control-plane/**"
      - ".github/workflows/heaven-control-plane-gate.yml"
  pull_request:
    paths:
      - "plugins/heaven-control-plane/**"
      - ".github/workflows/heaven-control-plane-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Heaven Control Plane
        run: python plugins/heaven-control-plane/verify.py
