name: Branch Lifecycle Enforcer

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-lifecycle-enforcer
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    steps:
      - name: Enforce merged-branch setting and clean proven-safe branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const protectedNames = new Set(["main", "heaven-bridge"]);
            const deleted = [];
            const preserved = [];
            const failures = [];

            const info = await github.rest.repos.get({ owner, repo });
            if (info.data.default_branch !== "main") {
              core.setFailed(`Default branch is ${info.data.default_branch}; refusing branch cleanup`);
              return;
            }

            // Native GitHub auto-delete is preferred, but GITHUB_TOKEN may not
            // have repository Administration permission. Try idempotently; the
            // lifecycle sweep below still enforces cleanup when this PATCH is denied.
            let deleteBranchOnMerge = Boolean(info.data.delete_branch_on_merge);
            let settingEnforcement = deleteBranchOnMerge ? "already-enabled" : "not-enabled";
            if (!deleteBranchOnMerge) {
              try {
                const updated = await github.rest.repos.update({
                  owner,
                  repo,
                  delete_branch_on_merge: true
                });
                deleteBranchOnMerge = Boolean(updated.data.delete_branch_on_merge);
                settingEnforcement = deleteBranchOnMerge ? "enabled-by-workflow" : "update-returned-false";
              } catch (error) {
                settingEnforcement = `permission-denied-or-unsupported:${error.status || "unknown"}`;
                core.warning(
                  "Could not set delete_branch_on_merge with GITHUB_TOKEN. " +
                  "The cleanup sweep still enforces merged-branch deletion. " +
                  "Repository admin remediation: Settings > General > Pull Requests > " +
                  "'Automatically delete head branches', or PATCH /repos/{owner}/{repo} " +
                  "with {\"delete_branch_on_merge\":true} using an Administration-write token."
                );
              }
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            for (const branchInfo of branches) {
              const branch = branchInfo.name;
              if (protectedNames.has(branch)) {
                preserved.push({ branch, reason: "reserved-branch" });
                continue;
              }

              let ref;
              try {
                ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status === 404) {
                  preserved.push({ branch, reason: "already-absent" });
                  continue;
                }
                throw error;
              }

              const branchSha = ref.data.object.sha;
              const detail = await github.rest.repos.getBranch({ owner, repo, branch });
              if (detail.data.protected) {
                preserved.push({ branch, sha: branchSha, reason: "protected" });
                continue;
              }

              const open = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branch}`,
                per_page: 100
              });
              if (open.data.length) {
                preserved.push({
                  branch,
                  sha: branchSha,
                  reason: `open-pr-${open.data[0].number}`
                });
                continue;
              }

              const mainRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
              const mainSha = mainRef.data.object.sha;
              let safe = false;
              let reason = "unique-or-unproven";

              // Strongest proof: the exact branch tip is already an ancestor of main.
              try {
                const ancestry = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${branchSha}...${mainSha}`
                });
                if (ancestry.data.behind_by === 0) {
                  safe = true;
                  reason = "tip-ancestor-of-main";
                }
              } catch (error) {
                preserved.push({
                  branch,
                  sha: branchSha,
                  reason: `ancestry-check-failed:${error.status || "unknown"}`
                });
                continue;
              }

              // Squash/rebase merge proof: exact current branch tip must equal the
              // recorded merged PR head, and that merge commit must itself be on main.
              if (!safe) {
                const closed = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "closed",
                  base: "main",
                  head: `${owner}:${branch}`,
                  per_page: 100
                });

                for (const pr of closed) {
                  if (!pr.merged_at || !pr.merge_commit_sha || pr.head?.sha !== branchSha) {
                    continue;
                  }

                  const latestMain = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: "heads/main"
                  });
                  const reachability = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `${pr.merge_commit_sha}...${latestMain.data.object.sha}`
                  });

                  if (reachability.data.behind_by === 0) {
                    safe = true;
                    reason = `merged-pr-${pr.number}`;
                    break;
                  }
                }
              }

              if (!safe) {
                preserved.push({ branch, sha: branchSha, reason });
                continue;
              }

              // Race guard: never delete a branch that moved after the proof above.
              const latest = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });
              if (latest.data.object.sha !== branchSha) {
                preserved.push({
                  branch,
                  sha: latest.data.object.sha,
                  reason: "moved-during-audit"
                });
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`
                });

                try {
                  await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branch}`
                  });
                  failures.push({
                    branch,
                    sha: branchSha,
                    reason: "deletion-verification-failed"
                  });
                  continue;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }

                deleted.push({ branch, sha: branchSha, reason });
              } catch (error) {
                failures.push({
                  branch,
                  sha: branchSha,
                  reason: `delete-failed:${error.status || error.message || "unknown"}`
                });
              }
            }

            const finalBranches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });

            await core.summary
              .addHeading("Branch lifecycle enforcement")
              .addCodeBlock(JSON.stringify({
                deleteBranchOnMerge,
                settingEnforcement,
                deleted,
                preserved,
                failures,
                finalBranchCount: finalBranches.length
              }, null, 2), "json")
              .write();

            if (failures.length) {
              core.setFailed(`Failed to delete ${failures.length} branch(es) that were proven safe.`);
            }
