name: Branch Cleanup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

concurrency:
  group: branch-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete stale branches with exact-tip guards
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
          @{ branch='agent/fix-release-gate-20260929-0926'; sha='5f3adee2a7426f93d59436552c8afa30b06b0d47' }
          @{ branch='feature/public-updater-feed-20260929'; sha='8c00e278f0603c86f566e71437a2be22440c7a57' }
          @{ branch='feature/public-updater-mirror-20260929'; sha='d898e6aeb64369990785baec5662436ea4958c35' }
          @{ branch='fix/build-release-windows-detection-20260929'; sha='ce3dd3594c67e606ed68d059fedbd9989dbda8a8' }
          @{ branch='fix/build-release-windows-host-detection-20260929'; sha='1fd30c477d0f6464643744fcf041d8a11d842c26' }
          @{ branch='fix/clean-heaven-publication-workflow-20260929'; sha='e987673eaa7c16cd3d6aba51929d2da43d3ff5a9' }
          @{ branch='fix/heaven-release-publisher-no-gh-20260929'; sha='4f28fb3347fb01276d4efd2ee673aac26d51a8f7' }
          @{ branch='fix/heaven-rest-release-publication-20260929'; sha='f4f4c65420d9f8e757626e66b86f626cbed1207e' }
          @{ branch='fix/heaven-rest-updater-publication-20260929'; sha='f6a84c2d342226bb7b070f7bc5bfe995234265ff' }
          @{ branch='fix/heaven-updater-publication-runtime-20260929'; sha='285367b0b7e02b2d2bab1a23ebd5dc11bab70aa8' }
          @{ branch='fix/mod-workflows-current-main-20260929'; sha='ee0fc111f904d4e78d19bbf94a64af7f8de79bb5' }
          @{ branch='fix/post-171-release-regressions-20260929'; sha='7df71b76e40768176a58b682fff6509d4f2f3133' }
          @{ branch='fix/public-updater-mirror-clean-20260929'; sha='822c5d7656e96848bbe0e8884ce0ff750b18c87d' }
          @{ branch='fix/release-build-windows-detection-20260929'; sha='121bb7567f0a011d9e28a693a80ad517be7505a5' }
          @{ branch='fix/release-gate-remaining-blockers-20260929'; sha='cf820bd4dd5cccad07b5b3f80c9ddee62be29a7c' }
          @{ branch='fix/release-runtime-cleanup-20260929'; sha='fac8987b1f8090647ceac2bc66f02d8995eaa4c5' }
          @{ branch='fix/release-windows-host-detection-20260929'; sha='85b5ca269e284389774c60a9e5ddaf892375766a' }
          @{ branch='fix/repair-corrupt-release-gate-and-publisher-20260929'; sha='acf25b9f8c134a38a6477d75b871090024c750db' }
          @{ branch='fix/rest-updater-publication-20260929'; sha='b358576ecca192117c7c3f0c46f44f273f744274' }
          @{ branch='fix/updater-release-gate-verification-final-20260929'; sha='5243d536285c7eb7c72004710231f3274115908d' }
          @{ branch='fix/updater-rest-publication-20260929'; sha='f337608722149ce3d9e9c20e17bada8a6fb7dc8b' }
          @{ branch='fix/v8.8.10-release-continuity-20260929'; sha='622ad3641fe9952e58c1afb65f5f8fef0f8b347e' }
          @{ branch='fix/v8.8.10-release-verification-regressions-20260929'; sha='e87937d0602ed8986196d056e9981ad4cb333025' }
          @{ branch='recovery/complete-mod-workflows-20260929'; sha='cae2407e5245ab27339967f2b5522a37c1e60152' }
          )
          $deleted = @()
          $skipped = @()
          foreach ($t in $targets) {
            $line = git ls-remote --heads origin ("refs/heads/" + $t.branch)
            if (-not $line) {
              $skipped += "$($t.branch):already-absent"
              continue
            }
            $actual = ($line -split '\s+')[0]
            if ($actual -ne $t.sha) {
              $skipped += "$($t.branch):tip-changed"
              continue
            }
            git push origin --delete $t.branch
            if ($LASTEXITCODE -ne 0) {
              throw "Failed deleting $($t.branch)"
            }
            $deleted += $t.branch
          }
          "Deleted $($deleted.Count): $($deleted -join ', ')"
          "Skipped $($skipped.Count): $($skipped -join ', ')"
          "Remaining:"
          git ls-remote --heads origin
