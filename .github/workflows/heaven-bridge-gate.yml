name: Heaven Local Bridge Gate

on:
  push:
    branches:
      - main
    paths:
      - 'heaven-bridge/worker.py'
      - 'heaven-bridge/bootstrap.ps1'
      - 'heaven-bridge/manage.ps1'
      - 'heaven-bridge/install-github-runner.ps1'
      - 'heaven-bridge/uia.ps1'
      - 'heaven-bridge/test_worker.py'
      - 'heaven-bridge/tests/**'
      - 'heaven-bridge/plugin/**'
      - '.github/workflows/heaven-bridge-gate.yml'
      - 'plugins/heaven-control-plane/**'
  pull_request:
    paths:
      - 'heaven-bridge/worker.py'
      - 'heaven-bridge/bootstrap.ps1'
      - 'heaven-bridge/manage.ps1'
      - 'heaven-bridge/install-github-runner.ps1'
      - 'heaven-bridge/uia.ps1'
      - 'heaven-bridge/test_worker.py'
      - 'heaven-bridge/tests/**'
      - 'heaven-bridge/plugin/**'
      - '.github/workflows/heaven-bridge-gate.yml'
      - 'plugins/heaven-control-plane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-local-bridge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-windows:
    name: Verify on Heaven self-hosted runner
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    steps:
      - name: Check out exact bridge source
        uses: actions/checkout@v4

      - name: Verify system Python
        shell: pwsh
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Compile bridge Python
        shell: pwsh
        run: |
          python -m py_compile heaven-bridge/worker.py heaven-bridge/test_worker.py heaven-bridge/tests/test_worker.py

      - name: Run bridge worker tests
        shell: pwsh
        run: |
          python heaven-bridge/test_worker.py
          python heaven-bridge/tests/test_worker.py

      - name: Run Heaven control-plane vertical slice tests
        shell: pwsh
        run: |
          python plugins/heaven-control-plane/verify.py

      - name: Parse operator PowerShell
        shell: pwsh
        run: |
          foreach ($path in @('heaven-bridge/bootstrap.ps1', 'heaven-bridge/manage.ps1', 'heaven-bridge/install-github-runner.ps1', 'heaven-bridge/uia.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate Heaven Local Bridge plugin source
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=json.loads(pathlib.Path('heaven-bridge/plugin/plugin.json').read_text()); c=json.loads(pathlib.Path('heaven-bridge/plugin/.codex-plugin/plugin.json').read_text()); assert p['name']=='heaven-local-bridge'; assert p['version']==c['version']; assert pathlib.Path('heaven-bridge/plugin/skills/heaven-bridge/SKILL.md').is_file(); assert pathlib.Path('heaven-bridge/plugin/skills/heaven-code-execution/SKILL.md').is_file(); assert pathlib.Path('heaven-bridge/plugin/skills/heaven-desktop-control/SKILL.md').is_file(); print('plugin', p['version'], 'ok')"
