name: Plugin Toolbox Gate

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.github/workflows/plugin-toolbox-gate.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugin-toolbox-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-toolbox-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify plugin toolbox on Heaven
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify Python
        shell: powershell
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 10), sys.version"

      - name: Compile plugin Python
        shell: powershell
        run: python -m compileall -q plugins

      - name: Run unified plugin verification
        shell: powershell
        run: python plugins/verify.py

      - name: Check patch whitespace
        shell: powershell
        run: git diff --check HEAD^ HEAD
