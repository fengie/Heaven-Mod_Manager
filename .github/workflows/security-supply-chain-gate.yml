name: Security Supply Chain Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'SECURITY.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-29.md'
      - '_AGENT_TRAINING/SECURITY_SUPPLY_CHAIN.md'
      - 'scripts/Verify-Release.ps1'
      - 'scripts/Test-CiSecurityPolicy.ps1'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'SECURITY.md'
      - '_AGENT_CONTEXT/SECURITY_HARDENING_2026-09-29.md'
      - '_AGENT_TRAINING/SECURITY_SUPPLY_CHAIN.md'
      - 'scripts/Verify-Release.ps1'
      - 'scripts/Test-CiSecurityPolicy.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-supply-chain-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: Enforce immutable actions and runner trust boundary
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 10
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit workflow security policy
        shell: powershell
        run: .\scripts\Test-CiSecurityPolicy.ps1 -Root $env:GITHUB_WORKSPACE
