name: Temporary Heaven Bridge Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-heaven-bridge-recovery.yml'

permissions:
  contents: read

concurrency:
  group: temporary-heaven-bridge-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover Heaven Local Bridge
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover and verify bridge worker
        shell: powershell
        run: |
          .\heaven-bridge\manage.ps1 RECOVER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\heaven-bridge\manage.ps1 STATUS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
