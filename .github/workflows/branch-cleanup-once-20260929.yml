name: One-time safe branch cleanup 2026-09-29

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-cleanup-once-20260929.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[branch-cleanup-once-20260929]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches proven safe at runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          candidates=(
            'agent/federation-registry-20260929'
            'agent/security-authorization-closure-20260929'
            'agent/security-authorization-reconcile-20260929'
            'agent/verification-reliability-20260929'
            'agent/liveness-scheduler-machine-policy-20260929'
            'agent/replacefilew-failure-characterization-v2'
            'agent/replacefilew-journal-assertions-20260927'
            'agent/support-auto-category-reparse-fallback-audit-20260928'
            'agent/support-visual-gallery-reparse-audit-20260928'
            'fix/release-starvation-20260929'
            'fix/updater-abandoned-mutex-20260929'
          )

          default_branch="$(gh api "repos/$REPO" --jq '.default_branch')"
          if [[ "$default_branch" != 'main' ]]; then
            echo "Refusing cleanup: default branch is $default_branch, not main."
            exit 1
          fi

          mapfile -t open_heads < <(gh pr list --repo "$REPO" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          deleted=()
          preserved=()

          for branch in "${candidates[@]}"; do
            if [[ "$branch" == "$default_branch" || "$branch" == release/* ]]; then
              preserved+=("$branch:default-or-release")
              continue
            fi

            if printf '%s\n' "${open_heads[@]:-}" | grep -Fxq -- "$branch"; then
              preserved+=("$branch:open-pr")
              continue
            fi

            encoded="${branch//\//%2F}"
            if ! branch_json="$(gh api "repos/$REPO/branches/$encoded" 2>/dev/null)"; then
              preserved+=("$branch:missing")
              continue
            fi

            if [[ "$(jq -r '.protected' <<<"$branch_json")" == 'true' ]]; then
              preserved+=("$branch:protected")
              continue
            fi

            branch_sha="$(jq -r '.commit.sha' <<<"$branch_json")"
            main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
            relation="$(gh api "repos/$REPO/compare/$branch_sha...$main_sha")"
            unique_to_branch="$(jq -r '.behind_by' <<<"$relation")"
            safe=false
            reason=''

            if [[ "$unique_to_branch" == '0' ]]; then
              safe=true
              reason='ancestor-of-main'
            else
              merged_pr="$(gh pr list --repo "$REPO" --state merged --base main --head "$branch" --limit 20 --json number,headRefOid,mergeCommit --jq ".[] | select(.headRefOid == \"$branch_sha\" and .mergeCommit.oid != null) | [.number, .mergeCommit.oid] | @tsv" | head -n1 || true)"
              if [[ -n "$merged_pr" ]]; then
                pr_number="${merged_pr%%$'\t'*}"
                merge_sha="${merged_pr#*$'\t'}"
                latest_main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
                merge_relation="$(gh api "repos/$REPO/compare/$merge_sha...$latest_main_sha")"
                merge_unique="$(jq -r '.behind_by' <<<"$merge_relation")"
                if [[ "$merge_unique" == '0' ]]; then
                  safe=true
                  reason="merged-pr-$pr_number"
                fi
              fi
            fi

            if [[ "$safe" != 'true' ]]; then
              preserved+=("$branch:unique-or-unproven")
              continue
            fi

            latest_branch_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$latest_branch_sha" != "$branch_sha" ]]; then
              preserved+=("$branch:moved-during-check")
              continue
            fi

            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "Deletion verification failed for $branch"
              exit 1
            fi
            deleted+=("$branch:$reason")
          done

          {
            echo '## One-time branch cleanup'
            echo ''
            echo "Baseline main at job start/current checks: $(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
            echo ''
            echo '### Deleted'
            if ((${#deleted[@]})); then printf -- '- %s\n' "${deleted[@]}"; else echo '- none'; fi
            echo ''
            echo '### Preserved'
            if ((${#preserved[@]})); then printf -- '- %s\n' "${preserved[@]}"; else echo '- none'; fi
          } >> "$GITHUB_STEP_SUMMARY"
