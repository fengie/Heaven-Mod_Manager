name: Workflow Feature PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'src/MhwModManager.Automation/FomodInstallerService.cs'
      - 'src/MhwModManager.Automation/RulesEditorService.cs'
      - 'src/MhwModManager.Automation/UpdateMigrationService.cs'
      - 'src/MhwModManager.Automation/CollectionRecipeService.cs'
      - 'src/MhwModManager.Automation/DuplicateCleanupService.cs'
      - 'src/MhwModManager.Automation/ArchiveImportService.cs'
      - 'src/MhwModManager.Automation/SmartInboxService.cs'
      - 'src/MhwModManager.Core/GameAdapters.cs'
      - 'src/MhwModManager.Core/WorkflowAnalysis.cs'
      - 'src/MhwModManager.Storage/DeploymentMetadata.cs'
      - 'src/MhwModManager.Storage/ProfileRepository.cs'
      - 'src/MhwModManager.Storage/ManagerDatabaseWorkflowExtensions.cs'
      - 'src/MhwModManager.Storage/LegacyV7Migrator.cs'
      - 'src/MhwModManager.Storage/ManagerDatabaseModLifecycleExtensions.cs'
      - 'src/MhwModManager.Storage/Schema.cs'
      - 'src/MhwModManager.Storage/CatalogSyncService.cs'
      - 'src/MhwModManager.Storage/CatalogDiscoveryService.cs'
      - 'src/MhwModManager.Filesystem/DeploymentExecutor.cs'
      - 'tests/MhwModManager.IntegrationTests/SupportBundlePrivacyTests.cs'
      - 'src/MhwModManager.App/App.xaml.cs'
      - 'src/MhwModManager.Diagnostics/AppLogging.cs'
      - 'src/MhwModManager.Diagnostics/SupportBundleService.cs'
      - 'src/MhwModManager.App/**'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'tests/MhwModManager.IntegrationTests/UpdaterSigningTests.cs'
      - 'tests/MhwModManager.AutomationTests/WorkflowTests.cs'
      - 'tests/MhwModManager.IntegrationTests/LegacyMigrationTests.cs'
      - 'tests/MhwModManager.IntegrationTests/DeploymentTests.cs'
      - 'tests/MhwModManager.IntegrationTests/CatalogSyncServiceTests.cs'
      - 'tests/MhwModManager.IntegrationTests/CatalogDiscoveryServiceTests.cs'
      - 'tests/MhwModManager.AutomationTests/AutomationServiceTests.cs'
      - 'tests/MhwModManager.Tests/**'
      - '_AGENT_CONTEXT/handoff-manifest.json'
      - '_AGENT_CONTEXT/CURRENT_REVISION.json'
      - '_AGENT_CONTEXT/CURRENT_STATE.md'
      - 'NEXT-AGENT-START-HERE.md'
      - '_AGENT_CONTEXT/EVIDENCE/*-heaven-windows-closure.log'
      - 'scripts/release/Sync-VerificationContinuity.ps1'
      - 'scripts/testing/Test-AgentHandoff.ps1'
      - 'scripts/testing/Test-AgentHandoff-NegativeFixtures.ps1'
      - 'scripts/testing/Test-VerificationContinuitySync.ps1'
      - '.github/workflows/windows-release-gate.yml'
      - '.github/workflows/workflow-feature-pr-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Cancel only superseded validation for the same PR/ref. Different PRs share the
  # self-hosted Heaven runner by queueing; they must never cancel each other's
  # exact-head evidence.
  group: workflow-feature-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admit viable PR candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject stale or explicitly superseded pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          event_head = os.environ["EVENT_HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/pulls/{pr_number}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "mhw-mods-workflow-feature-admission",
          }

          data = {}
          mergeable = None
          mergeable_state = "unknown"
          for attempt in range(4):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.load(response)
              mergeable = data.get("mergeable")
              mergeable_state = data.get("mergeable_state") or "unknown"
              if mergeable is True:
                  break
              if mergeable is False and mergeable_state not in {"unknown", "unstable"}:
                  break
              if attempt < 3:
                  time.sleep(2)

          labels = {
              str(label.get("name", "")).strip().lower()
              for label in data.get("labels", [])
              if isinstance(label, dict)
          }
          body = data.get("body") or ""
          superseded = (
              "superseded" in labels
              or re.search(
                  r"(?im)^\s*(?:status:\s*)?superseded\b|\bsuperseded by\b",
                  body,
              )
              is not None
          )

          reason = ""
          if data.get("state") != "open":
              reason = f"PR state is {data.get('state')}"
          elif data.get("head", {}).get("sha") != event_head:
              reason = (
                  "PR head moved from event SHA "
                  f"{event_head} to {data.get('head', {}).get('sha')}"
              )
          elif superseded:
              reason = "PR is explicitly marked superseded"
          elif mergeable is False and mergeable_state not in {"unknown", "unstable"}:
              reason = (
                  "GitHub reports the current PR head as non-mergeable "
                  f"(state={mergeable_state})"
              )

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as summary:
              if reason:
                  summary.write("### Workflow Feature admission rejected\n")
                  summary.write(reason + "\n")
                  summary.write(
                      "The expensive self-hosted Windows verification job was not scheduled.\n"
                  )
              elif mergeable is not True:
                  summary.write(
                      "Mergeability remained transient "
                      f"({mergeable}/{mergeable_state}) after bounded polling; "
                      "allowing exact-head verification to avoid a false rejection.\n"
                  )
              else:
                  summary.write(
                      f"PR admission passed for exact head {event_head}.\n"
                  )

          if reason:
              print(f"::error::{reason}")
              sys.exit(1)
          PY

      - name: Admit manual dispatch
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "Manual dispatch admitted." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Build and test workflow feature set on Heaven
    needs: admission
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') { throw "Workflow gate requires .NET SDK 10.0.401; found $version." }

      - name: Run exact repository verification gate
        id: repository_verify
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\\scripts\\release\\Verify-Release.ps1"

      - name: Restore workflow projects
        id: restore
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          dotnet restore .\src\MhwModManager.App\MhwModManager.App.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore .\tests\MhwModManager.AutomationTests\MhwModManager.AutomationTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build workflow product and tests
        id: build
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet build .\src\MhwModManager.App\MhwModManager.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\MhwModManager.AutomationTests\MhwModManager.AutomationTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused UX and XAML regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~UxHardeningTests|FullyQualifiedName~XamlBindingSafetyTests|FullyQualifiedName~SupportBundlePrivacyTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run legacy migration regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~LegacyMigrationTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run deployment concurrency regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~DeploymentTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run catalog sync regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~CatalogSyncServiceTests|FullyQualifiedName~CatalogDiscoveryServiceTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused workflow regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.AutomationTests\MhwModManager.AutomationTests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~WorkflowTests|FullyQualifiedName~AutomationServiceTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch whitespace
        if: ${{ !cancelled() }}
        shell: powershell
        run: git diff --check origin/main...HEAD
