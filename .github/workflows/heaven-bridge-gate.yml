name: Heaven Local Bridge Gate

on:
  push:
    branches:
      - main
      - heaven-bridge
    paths:
      - 'heaven-bridge/worker.py'
      - 'heaven-bridge/bootstrap.ps1'
      - 'heaven-bridge/manage.ps1'
      - 'heaven-bridge/test_worker.py'
      - 'heaven-bridge/tests/**'
      - 'heaven-bridge/plugin/**'
      - '.github/workflows/heaven-bridge-gate.yml'
  pull_request:
    paths:
      - 'heaven-bridge/worker.py'
      - 'heaven-bridge/bootstrap.ps1'
      - 'heaven-bridge/manage.ps1'
      - 'heaven-bridge/test_worker.py'
      - 'heaven-bridge/tests/**'
      - 'heaven-bridge/plugin/**'
      - '.github/workflows/heaven-bridge-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact bridge source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile bridge Python
        shell: pwsh
        run: |
          python -m py_compile heaven-bridge/worker.py heaven-bridge/test_worker.py heaven-bridge/tests/test_worker.py

      - name: Run primary bridge worker tests
        shell: pwsh
        run: |
          python heaven-bridge/test_worker.py

      - name: Run compatibility bridge worker tests
        shell: pwsh
        run: |
          python heaven-bridge/tests/test_worker.py

      - name: Parse bridge PowerShell
        shell: pwsh
        run: |
          foreach ($path in @('heaven-bridge/bootstrap.ps1', 'heaven-bridge/manage.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate plugin manifests
        shell: pwsh
        run: |
          python -c "import json,pathlib; a=json.loads(pathlib.Path('heaven-bridge/plugin/plugin.json').read_text()); b=json.loads(pathlib.Path('heaven-bridge/plugin/.codex-plugin/plugin.json').read_text()); assert a['name']=='heaven-local-bridge'; assert a['version']==b['version']; assert (pathlib.Path('heaven-bridge/plugin/skills/heaven-code-execution/SKILL.md')).is_file(); print('plugin', a['version'], 'ok')"
