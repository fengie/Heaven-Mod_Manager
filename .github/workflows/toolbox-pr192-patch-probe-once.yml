            +const GITHUB_HOST = "github.com";
            +const REPOSITORY_SEGMENT = /^[A-Za-z0-9_.-]+$/;
            +
            +function clean(value) {
            +  return String(value ?? "").trim();
            +}
            +
            +function normalizeRepositoryPath(value) {
            +  let repositoryPath = clean(value);
            +  if (!repositoryPath || /[\\\r\n\0]/.test(repositoryPath)) return null;
            +
            +  try {
            +    repositoryPath = decodeURIComponent(repositoryPath);
            +  } catch {
            +    return null;
            +  }
            +
            +  if (/[\\\r\n\0]/.test(repositoryPath)) return null;
            +  repositoryPath = repositoryPath.replace(/^\/+|\/+$/g, "");
            +
            +  if (repositoryPath.toLowerCase().endsWith(".git")) {
            +    repositoryPath = repositoryPath.slice(0, -4);
            +  }
            +
            +  const parts = repositoryPath.split("/");
            +  if (
            +    parts.length !== 2 ||
            +    !parts[0] ||
            +    !parts[1] ||
            +    parts.some(part => part === "." || part === "..") ||
            +    !REPOSITORY_SEGMENT.test(parts[0]) ||
            +    !REPOSITORY_SEGMENT.test(parts[1])
            +  ) {
            +    return null;
            +  }
            +
            +  return `${parts[0].toLowerCase()}/${parts[1].toLowerCase()}`;
            +}
            +
            +function hasExplicitUrlPort(value) {
            +  const authority = /^[A-Za-z][A-Za-z0-9+.-]*:\/\/([^/?#]*)/.exec(value)?.[1] || "";
            +  const hostPort = authority.slice(authority.lastIndexOf("@") + 1);
            +  return hostPort.includes(":");
            +}
            +
            +export function parseGitHubRepositoryRemote(remote) {
            +  const value = clean(remote);
            +  if (!value || /[\\\r\n\0]/.test(value) || /%[0-9a-f]{2}/i.test(value)) return null;
            +
            +  const scp = /^git@github\.com:([^?#]+)$/i.exec(value);
            +  if (scp) return normalizeRepositoryPath(scp[1]);
            +  if (hasExplicitUrlPort(value)) return null;
            +
            +  const authorityMatch = /^(?:https|ssh):\/\/([^/?#]+)(?:[/?#]|$)/i.exec(value);
            +  if (!authorityMatch) return null;
            +  const authorityHost = authorityMatch[1].slice(authorityMatch[1].lastIndexOf("@") + 1);
            +  if (authorityHost.includes(":")) return null;
            +
            +  let parsed;
            +  try {
            +    parsed = new URL(value);
            +  } catch {
            +    return null;
            +  }
            +
            +  if (!["https:", "ssh:"].includes(parsed.protocol)) return null;
            +  if (parsed.hostname.toLowerCase() !== GITHUB_HOST) return null;
            +  if (parsed.port || parsed.password || parsed.search || parsed.hash) return null;
            +
            +  if (parsed.protocol === "https:") {
            +    if (parsed.username) return null;
            +  } else if (parsed.username !== "git") {
            +    return null;
            +  }
            +
            +  return normalizeRepositoryPath(parsed.pathname);
            +}
            +
            +export function normalizeGitHubRepositoryIdentity(expected) {
            +  const value = clean(expected);
            +  if (!value) return null;
            +  return normalizeRepositoryPath(value) || parseGitHubRepositoryRemote(value);
            +}
            +
            +export function githubRemoteMatchesRepository(remote, expected) {
            +  const actual = parseGitHubRepositoryRemote(remote);
            +  const wanted = normalizeGitHubRepositoryIdentity(expected);
            +  return Boolean(actual && wanted && actual === wanted);
