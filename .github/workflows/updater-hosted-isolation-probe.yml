name: Isolated packaged updater acceptance probe

on:
  pull_request:
    paths:
      - '.github/workflows/updater-hosted-isolation-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-updater-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-updater-e2e:
    name: Verify published updater on a disposable Windows VM
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '1'
      MHW_E2E_TARGET_BUILD: '537'
      MHW_E2E_TARGET_SOURCE: '1e24b3519d56471bcb3995ab6b70ae9f6c09d00a'
      MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}/BuildLogs/updater-isolated-e2e/evidence.json

    steps:
      - name: Require GitHub-hosted disposable Windows and untouched updater state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'Refusing packaged updater acceptance on a persistent or non-Windows runner.'
          }
          $local = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if ([string]::IsNullOrWhiteSpace($local) -or -not [IO.Path]::IsPathFullyQualified($local)) {
            throw 'Dedicated test profile has no valid LocalApplicationData path.'
          }
          $updaterRoot = Join-Path $local 'MhwModManager/Updater'
          if (Test-Path -LiteralPath $updaterRoot) {
            $item = Get-Item -LiteralPath $updaterRoot -Force
            if (-not $item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
              throw 'Updater root is not an ordinary directory. Refusing any test mutation.'
            }
            if (@(Get-ChildItem -LiteralPath $updaterRoot -Force | Select-Object -First 1).Count -gt 0) {
              throw 'Updater root is occupied. Refusing any test mutation.'
            }
          }
          Write-Host 'PASS: disposable Windows runner and unoccupied updater namespace.'

      - name: Check out exact immutable v8.8.111 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 1e24b3519d56471bcb3995ab6b70ae9f6c09d00a
          persist-credentials: false

      - name: Provision pinned repository .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify pinned SDK
        shell: powershell
        run: .\scripts\ci\Assert-PinnedDotNetSdk.ps1

      - name: Build installed-client integration runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore ./tests/MhwModManager.IntegrationTests/MhwModManager.IntegrationTests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Integration restore failed.' }
          dotnet build ./tests/MhwModManager.IntegrationTests/MhwModManager.IntegrationTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Integration build failed.' }

      - name: Run published build 60 to build 537 update and rollback
        shell: pwsh
        env:
          MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MHW_MOD_MANAGER_GITHUB_TOKEN)) {
            throw 'Missing read-only token for published immutable release downloads.'
          }
          $evidenceRoot = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $runner = './tests/MhwModManager.IntegrationTests/bin/Release/net10.0-windows10.0.19041.0/MhwModManager.IntegrationTests.exe'
          if (-not (Test-Path -LiteralPath $runner)) { throw 'Built xUnit v3 integration runner is missing.' }
          & $runner --filter-class MhwModManager.IntegrationTests.UpdaterInstalledClientE2ETests 2>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot 'installed-client-test.log')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged updater E2E tests failed; inspect attached evidence.' }

      - name: Require positive apply, UI and rollback evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -PathType Leaf)) {
            throw 'No source-bound installed-client evidence was produced.'
          }
          $doc = Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($doc.status -eq 'FAIL') { throw 'Published updater E2E reported failure.' }
          if ($doc.targetSource -ne $env:MHW_E2E_TARGET_SOURCE -or [long]$doc.targetBuild -ne 537) {
            throw 'Installed-client evidence does not match exact published release.'
          }
          if ($doc.scenarioA.status -ne 'PASS' -or $doc.scenarioB.status -ne 'PASS') {
            throw 'Positive update and rollback scenarios did not both pass.'
          }
          if ($doc.scenarioA.selectorDisplayText -ne 'Updater E2E Fake Game' -or
              -not [bool]$doc.scenarioA.switchButtonEnabled -or
              -not [bool]$doc.scenarioA.settingsButtonEnabled) {
            throw 'Real installed WPF game-selector and controls were not verified.'
          }
          Write-Host 'PASS: published v8.8.111 update, installed UI and rollback evidence.'

      - name: Preserve test-owned evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isolated-updater-probe-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ github.workspace }}/BuildLogs/updater-isolated-e2e/**
