name: README timestamp

on:
  pull_request:
    paths:
      - README.md
      - '.github/workflows/readme-timestamp.yml'
      - VERSION.txt
      - VERSION_TIMESTAMPS.md
  push:
    branches:
      - main
    paths:
      - README.md
      - '.github/workflows/readme-timestamp.yml'
      - VERSION.txt
      - VERSION_TIMESTAMPS.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-timestamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-timestamp:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate README timestamp
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pattern = '^> .+ Last README update: \*\*[A-Z][a-z]+ [0-9]{1,2}, [0-9]{4} . [0-9]{1,2}:[0-9]{2}:[0-9]{2} (AM|PM) E(D|S)T\*\* _\(repo-enforced\)_$'
          if (-not (Test-Path 'README.md' -PathType Leaf)) {
            if ('${{ github.event_name }}' -eq 'workflow_dispatch') { exit 0 }
            throw 'README.md is missing.'
          }
          $current = Get-Content -LiteralPath 'README.md' -Encoding UTF8 | Where-Object { $_ -match $pattern } | Select-Object -First 1
          if (-not $current) { throw 'README.md must contain the readable repo-enforced America/New_York timestamp line.' }

          $readmeChanged = $false
          $previous = $null
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git fetch origin '${{ github.base_ref }}' --depth=1
            if ($LASTEXITCODE -ne 0) { throw 'failed to fetch pull-request base for README timestamp validation' }
            $baseRange = "origin/${{ github.base_ref }}...HEAD"
            git diff --quiet $baseRange -- README.md
            $readmeChanged = ($LASTEXITCODE -ne 0)
            $previous = @(& git show "origin/${{ github.base_ref }}:README.md" 2>$null) | Where-Object { $_ -match $pattern } | Select-Object -First 1
          } elseif ('${{ github.event_name }}' -eq 'push') {
            & git rev-parse HEAD^ *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --quiet HEAD^ HEAD -- README.md
              $readmeChanged = ($LASTEXITCODE -ne 0)
              $previous = @(& git show 'HEAD^:README.md' 2>$null) | Where-Object { $_ -match $pattern } | Select-Object -First 1
            }
          }
          if ($readmeChanged -and $previous -and $current -eq $previous) {
            throw 'README.md changed without refreshing its Last README update timestamp.'
          }
          $global:LASTEXITCODE = 0

      - name: Validate version timestamp ledger
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'VERSION.txt' -PathType Leaf)) { exit 0 }
          if (-not (Test-Path 'VERSION_TIMESTAMPS.md' -PathType Leaf)) { throw 'VERSION_TIMESTAMPS.md is required for versioned repositories.' }

          $version = (Get-Content -LiteralPath 'VERSION.txt' -Raw -Encoding UTF8).Trim()
          if (-not $version) { throw 'VERSION.txt is empty.' }
          $escaped = [regex]::Escape($version)
          $row = Select-String -LiteralPath 'VERSION_TIMESTAMPS.md' -Pattern "^\| $escaped \|" | Select-Object -First 1
          if (-not $row) { throw "VERSION_TIMESTAMPS.md is missing current version $version." }

          $versionChanged = $false
          $ledgerChanged = $false
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseRange = "origin/${{ github.base_ref }}...HEAD"
            git diff --quiet $baseRange -- VERSION.txt
            $versionChanged = ($LASTEXITCODE -ne 0)
            git diff --quiet $baseRange -- VERSION_TIMESTAMPS.md
            $ledgerChanged = ($LASTEXITCODE -ne 0)
          } elseif ('${{ github.event_name }}' -eq 'push') {
            & git rev-parse HEAD^ *> $null
            if ($LASTEXITCODE -eq 0) {
              git diff --quiet HEAD^ HEAD -- VERSION.txt
              $versionChanged = ($LASTEXITCODE -ne 0)
              git diff --quiet HEAD^ HEAD -- VERSION_TIMESTAMPS.md
              $ledgerChanged = ($LASTEXITCODE -ne 0)
            }
          }
          if ($versionChanged -and -not $ledgerChanged) {
            throw 'VERSION.txt changed without updating VERSION_TIMESTAMPS.md in the same change.'
          }
          $global:LASTEXITCODE = 0

