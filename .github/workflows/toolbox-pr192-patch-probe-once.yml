name: Toolbox PR192 Patch Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolbox-pr192-patch-probe-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Apply PR192 patch to exact Toolbox main
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 10
    steps:
      - name: Verify patch applies without replacing newer main changes
        shell: powershell
        env:
          PATCH_TEXT: |
            diff --git a/heaven-bridge/repository-identity.mjs b/heaven-bridge/repository-identity.mjs
