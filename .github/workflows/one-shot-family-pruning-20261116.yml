name: One-shot family pruning candidate benchmark (2026-11-16)
on:
  push:
    branches:
      - bench/family-pair-pruning-20261116
    paths:
      - '.github/workflows/one-shot-family-pruning-20261116.yml'
permissions:
  contents: read
concurrency:
  group: onetime-family-pruning-20261116
  cancel-in-progress: false
jobs:
  profile:
    name: Profile shared versus separate family roots after safe pruning
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 65
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select isolated .NET SDK
        shell: powershell
        run: |
          $sdkRoot=Join-Path $env:RUNNER_TEMP ("dotnet-family-{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $sdkRoot | Out-Null
          "DOTNET_INSTALL_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Record runner provenance
        shell: powershell
        run: |
          Write-Host "SOURCE_SHA=$env:GITHUB_SHA"
          Write-Host "RUN_ID=$env:GITHUB_RUN_ID"
          $cpu=Get-CimInstance Win32_Processor | Select-Object -First 1
          $os=Get-CimInstance Win32_OperatingSystem
          Write-Host "CPU=$($cpu.Name); cores=$($cpu.NumberOfCores); logical=$($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM_GiB=$([math]::Round($os.TotalVisibleMemorySize/1048576,2))"
          .\scripts\ci\Assert-PinnedDotNetSdk.ps1
      - name: Run candidate family topology BenchmarkDotNet ShortRun
        shell: powershell
        timeout-minutes: 50
        run: |
          .\scripts\benchmarks\Run-Benchmarks.ps1 -Filter '*FamilyTopologyBenchmarks*' -Job Short
      - name: Preserve JSON measurements
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: family-pruning-${{ github.sha }}-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/results/*-full-compressed.json
          if-no-files-found: warn
          retention-days: 3
