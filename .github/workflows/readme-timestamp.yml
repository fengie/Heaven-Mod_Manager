name: README timestamp

on:
  pull_request:
    paths: [README.md]
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-timestamp-${{ github.repository }}
  cancel-in-progress: true

jobs:
  readme-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate README timestamp on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pattern='^> ⏱️ Last README update: `[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z` _\(auto-maintained\)_$'
          current="$(grep -m1 -E "$pattern" README.md || true)"
          [[ -n "$current" ]] || { echo "::error::README.md must contain the auto-maintained timestamp."; exit 1; }
          git fetch origin "${{ github.base_ref }}" --depth=1
          base="$(git show "origin/${{ github.base_ref }}:README.md" 2>/dev/null | grep -m1 -E "$pattern" || true)"
          [[ "$current" != "$base" ]] || { echo "::error::README.md changed without refreshing its timestamp."; exit 1; }

      - name: Stamp README on main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re
          p=Path("README.md")
          if not p.exists(): raise SystemExit(0)
          text=p.read_text(encoding="utf-8")
          stamp=datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          repl=f"> ⏱️ Last README update: `{stamp}` _(auto-maintained)_"
          pat=re.compile(r"^> ⏱️ Last README update: `[^\n]+` _\(auto-maintained\)_$",re.MULTILINE)
          if pat.search(text):
              text=pat.sub(repl,text,count=1)
          else:
              lines=text.splitlines()
              i=1 if lines and lines[0].startswith("#") else 0
              lines[i:i]=["",repl]
              text="\n".join(lines)
              if not text.endswith("\n"): text+="\n"
          p.write_text(text,encoding="utf-8")
          PY

      - name: Commit refreshed timestamp
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README timestamp"
          git push
