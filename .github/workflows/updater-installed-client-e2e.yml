name: Updater Installed Client E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Windows Release Gate'
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: updater-installed-client-e2e
  cancel-in-progress: true

jobs:
  installed-client-e2e:
    name: Real packaged updater update and rollback
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # GitHub-hosted Windows currently fails before runner allocation; use the repaired Heaven runner.
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '1'
      MHW_E2E_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}\BuildLogs\updater-installed-e2e\evidence.json

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven updater E2E runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            "candidate_sha=$env:MHW_E2E_SOURCE_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "dotnet_sdk=$(& dotnet --version)"
            "run_opt_in=$env:MHW_RUN_UPDATER_INSTALLED_E2E"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'provenance.txt') -Encoding UTF8
          if ($env:MHW_RUN_UPDATER_INSTALLED_E2E -ne '1') {
            throw 'Updater installed-client E2E opt-in is not active.'
          }

      - name: Restore integration test project
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integration test project
        shell: powershell
        run: |
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve exact published updater target
        shell: powershell
        env:
          MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MHW_MOD_MANAGER_GITHUB_TOKEN)) {
            throw 'Repository token was not supplied to updater release discovery.'
          }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:MHW_MOD_MANAGER_GITHUB_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'MHW-Mod-Manager-Updater-E2E'
          }
          try {
            $releases = Invoke-RestMethod -UseBasicParsing -Method Get -Headers $headers `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
              -TimeoutSec 60
          } catch {
            throw "Failed to list updater releases for installed-client E2E: $($_.Exception.Message)"
          } finally {
            $headers.Authorization = $null
          }
          $target = $null
          foreach ($release in $releases) {
            $tag = [string]$release.tag_name
            if ($tag -notmatch '^updater-main-(\d+)$') { continue }
            $build = [long]$Matches[1]
            if ($build -le 61) { continue }
            if ([bool]$release.draft -or [bool]$release.prerelease -or -not [bool]$release.immutable) { continue }
            $source = [string]$release.target_commitish
            if ($source -notmatch '^[0-9a-fA-F]{40}$') { continue }
            if ($source -ne $env:MHW_E2E_SOURCE_SHA) { continue }
            $target = [pscustomobject]@{ Build = $build; Source = $source.ToLowerInvariant(); Tag = $tag }
            break
          }
          if (-not $target) {
            throw "No immutable updater release newer than build 61 was published for exact source $env:MHW_E2E_SOURCE_SHA."
          }

          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "MHW_E2E_TARGET_BUILD=$($target.Build)`r`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "MHW_E2E_TARGET_SOURCE=$($target.Source)`r`n", $utf8NoBom)
          Write-Host "Resolved installed-client target $($target.Tag) / $($target.Source)."

      - name: Run installed-client updater E2E
        shell: powershell
        env:
          MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MHW_MOD_MANAGER_GITHUB_TOKEN)) {
            throw 'Repository token was not supplied to the installed-client updater E2E step.'
          }
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) {
            throw "Built xUnit v3 integration runner is missing: $runner"
          }

          $stdout = Join-Path $evidence 'installed-client-e2e.stdout.log'
          $stderr = Join-Path $evidence 'installed-client-e2e.stderr.log'
          $log = Join-Path $evidence 'installed-client-e2e-test.log'
          $process = Start-Process -FilePath $runner `
            -ArgumentList @('--filter-class', 'MhwModManager.IntegrationTests.UpdaterInstalledClientE2ETests') `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          @('=== STDOUT ===') | Set-Content -LiteralPath $log -Encoding UTF8
          if (Test-Path -LiteralPath $stdout) {
            Get-Content -LiteralPath $stdout | Add-Content -LiteralPath $log
          }
          @('=== STDERR ===') | Add-Content -LiteralPath $log
          if (Test-Path -LiteralPath $stderr) {
            Get-Content -LiteralPath $stderr | Add-Content -LiteralPath $log
          }

          if ($process.ExitCode -ne 0) {
            Write-Host '=== INSTALLED-CLIENT E2E FAILURE LOG ==='
            if (Test-Path -LiteralPath $log) {
              Get-Content -LiteralPath $log | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host '<missing installed-client-e2e-test.log>'
            }
            Write-Host '=== INSTALLED-CLIENT E2E FAILURE EVIDENCE ==='
            if (Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH) {
              Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host '<missing evidence.json>'
            }
            throw "Installed-client updater E2E failed with exit code $($process.ExitCode). See console diagnostics above."
          }
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Installed-client updater E2E returned success without producing updater E2E evidence.json.'
          }

      - name: Verify updater success and rollback evidence
        shell: powershell
        run: |
          $evidenceDir = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $log = Join-Path $evidenceDir 'rollback-regression-tests.log'
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Updater E2E evidence.json is missing.'
          }
          $doc = Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($doc.status -eq 'FAIL') {
            throw "Updater E2E evidence reports failure: $($doc.failureType): $($doc.failureMessage)"
          }
          if ($doc.scenarioA.status -ne 'PASS') {
            throw "Installed-client update scenario did not pass: $($doc.scenarioA.status)"
          }
          if ([string]$doc.scenarioA.selectorDisplayText -ne 'Updater E2E Fake Game') {
            throw "Installed-client selector UI acceptance failed: '$($doc.scenarioA.selectorDisplayText)'."
          }
          if (-not [bool]$doc.scenarioA.switchButtonEnabled) {
            throw 'Installed-client selector UI acceptance did not retain an enabled Switch button.'
          }
          if (-not [bool]$doc.scenarioA.settingsButtonEnabled) {
            throw 'Installed-client selector UI acceptance did not retain an enabled Settings button.'
          }
          if ($doc.scenarioB.status -ne 'PASS') {
            throw "Injected rollback scenario did not pass: $($doc.scenarioB.status)"
          }
          @(
            'installed_client_e2e=PASS'
            ('scenarioA=' + $doc.scenarioA.status)
            ('selectorDisplayText=' + [string]$doc.scenarioA.selectorDisplayText)
            ('switchButtonEnabled=' + [string]$doc.scenarioA.switchButtonEnabled)
            ('settingsButtonEnabled=' + [string]$doc.scenarioA.settingsButtonEnabled)
            ('scenarioB=' + $doc.scenarioB.status)
            ('restoredBuild=' + $doc.scenarioB.restoredBuild)
            ('restoredSource=' + $doc.scenarioB.restoredSource)
          ) | Set-Content -LiteralPath $log -Encoding UTF8

      - name: Collect updater runtime log
        if: always()
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $runtimeLog = Join-Path $env:LOCALAPPDATA 'MhwModManager\Updater\updater.log'
          if (Test-Path -LiteralPath $runtimeLog) {
            Copy-Item -LiteralPath $runtimeLog -Destination (Join-Path $evidence 'updater-runtime.log') -Force
          }

      - name: Upload installed-client E2E evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: updater-installed-client-e2e-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ github.workspace }}\BuildLogs\updater-installed-e2e\**

      - name: Persist successful installed-client E2E evidence
        if: success() && github.event_name == 'workflow_run'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Repository token was not supplied to updater E2E evidence persistence.'
          }
          $authBytes = [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN")
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String($authBytes)
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Successful updater E2E did not produce evidence.json.'
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/main before persisting updater E2E evidence.'
          }
          $remoteMain = (git rev-parse origin/main).Trim()
          $persistenceBaseSha = $remoteMain
          if ($remoteMain -ne $env:MHW_E2E_SOURCE_SHA) {
            git merge-base --is-ancestor $env:MHW_E2E_SOURCE_SHA $remoteMain
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::notice::Skipping updater E2E evidence persistence because current main $remoteMain is not a descendant of tested source $env:MHW_E2E_SOURCE_SHA."
              exit 0
            }

            $driftPaths = @(& git diff --name-only "$env:MHW_E2E_SOURCE_SHA..$remoteMain" --)
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to classify main drift before persisting updater E2E evidence.'
            }
            . (Join-Path $PWD 'scripts\release\UpdaterReleasePolicy.ps1')
            $drift = Get-UpdaterMainDriftDecision -CurrentSourceSha $env:MHW_E2E_SOURCE_SHA -RemoteMainSha $remoteMain -ChangedPaths $driftPaths
            if (-not $drift.Publish) {
              Write-Host "::notice::Skipping updater E2E evidence persistence because main advanced through release-relevant paths ($($drift.Reason))."
              exit 0
            }

            Write-Host "::notice::Main advanced only through release-irrelevant evidence/cache paths; persisting E2E closure on top of $remoteMain."
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to move the E2E evidence persistence checkout to current evidence-only main.'
            }
          }

          $evidenceDir = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $evidenceHash = (Get-FileHash -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Algorithm SHA256).Hash
          $provenancePath = Join-Path $evidenceDir 'provenance.txt'
          $testLogPath = Join-Path $evidenceDir 'installed-client-e2e-test.log'
          $rollbackLogPath = Join-Path $evidenceDir 'rollback-regression-tests.log'
          $provenanceHash = if (Test-Path -LiteralPath $provenancePath) { (Get-FileHash -LiteralPath $provenancePath -Algorithm SHA256).Hash } else { 'missing' }
          $testLogHash = if (Test-Path -LiteralPath $testLogPath) { (Get-FileHash -LiteralPath $testLogPath -Algorithm SHA256).Hash } else { 'missing' }
          $rollbackLogHash = if (Test-Path -LiteralPath $rollbackLogPath) { (Get-FileHash -LiteralPath $rollbackLogPath -Algorithm SHA256).Hash } else { 'missing' }

          $version = (Get-Content -LiteralPath 'VERSION.txt' -Raw).Trim()
          $closurePath = "_AGENT_CONTEXT/EVIDENCE/updater-installed-client-e2e-v$version.log"
          @(
            ("MHW Manual Mod Manager v$version installed-client updater E2E closure")
            ('source_sha=' + $env:MHW_E2E_SOURCE_SHA)
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('runner_os=' + $env:RUNNER_OS)
            ('runner_arch=' + $env:RUNNER_ARCH)
            ('dotnet_sdk=' + (& dotnet --version))
            ('evidence_sha256=' + $evidenceHash)
            ('provenance_sha256=' + $provenanceHash)
            ('installed_client_test_log_sha256=' + $testLogHash)
            ('rollback_regression_log_sha256=' + $rollbackLogHash)
            ''
            '=== EVIDENCE.JSON ==='
            (Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw)
          ) | Set-Content -LiteralPath $closurePath -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $closurePath
          git commit -m 'Persist updater installed-client E2E evidence [skip ci]'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create updater installed-client E2E evidence commit.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              throw 'Updater E2E evidence was produced, but the failed push could not be diagnosed.'
            }
            $remoteMain = (git rev-parse origin/main).Trim()
            if ($remoteMain -ne $persistenceBaseSha) {
              Write-Host "::notice::Skipping the local updater E2E evidence commit because main advanced from persistence base $persistenceBaseSha to $remoteMain during the push race."
              exit 0
            }
            throw "Failed to persist updater E2E evidence while origin/main still points at persistence base $persistenceBaseSha."
          }
