name: Windows Release Gate
# Exact-main retrigger after v8.8.10 continuity and Heaven release-build repair.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/windows-release-gate.yml'
      - 'legacy-v7/**'
      - 'MhwModManager.sln'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION.txt'
      - 'VALIDATION.md'
      - 'Open Startup Logs.bat'
      - 'OPEN MASTER DEBUG LOG.bat'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  # Publication spans two repositories. Never cancel a run after it may have
  # started publishing one side of the updater channel.
  group: windows-release-main
  cancel-in-progress: false

jobs:
  windows-release:
    name: Verify and publish on Windows
    # GitHub-hosted Windows currently fails before runner allocation; use the repaired Heaven runner.
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 90

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven release runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Record runner provenance
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path BuildLogs | Out-Null
          @(
            "github_sha=$env:GITHUB_SHA"
            "github_ref=$env:GITHUB_REF"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "dotnet_sdk=$(& dotnet --version)"
            "powershell_5=$(& powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          ) | Set-Content -Path BuildLogs\ci-windows-provenance.txt -Encoding UTF8

      - name: Run exact repository verification gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\release\Verify-Release.ps1"

      - name: Run exact release build and publish gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\build\Build-Release.ps1"

      - name: Test updater publication policy
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\testing\Test-UpdaterReleasePolicy.ps1"

      - name: Install verified GitHub CLI for publication
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          # Release tooling is part of the trusted build chain. Never execute a moving
          # "latest" asset or an arbitrary preinstalled gh.exe in this privileged job.
          $version = '2.101.0'
          $expectedSha256 = 'bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794'
          $assetName = "gh_${version}_windows_amd64.zip"
          $uri = "https://github.com/cli/cli/releases/download/v${version}/${assetName}"
          $zip = Join-Path $env:RUNNER_TEMP $assetName
          $toolRoot = Join-Path $env:RUNNER_TEMP "gh-cli-${version}"

          Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $toolRoot -Recurse -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest -UseBasicParsing -Headers @{ 'User-Agent'='MHW-Mod-Manager-Release-Gate' } -Uri $uri -OutFile $zip -TimeoutSec 120

          $actualSha256 = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
            throw "GitHub CLI archive digest mismatch. Expected $expectedSha256 but got $actualSha256."
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $toolRoot -Force
          $gh = Get-ChildItem -LiteralPath $toolRoot -Filter 'gh.exe' -Recurse | Select-Object -First 1
          if (-not $gh) {
            throw 'Verified GitHub CLI archive did not contain gh.exe.'
          }

          $versionOutput = @(& $gh.FullName --version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -eq 0 -or -not ([string]$versionOutput[0]).Contains($version)) {
            throw "Verified GitHub CLI executable did not report pinned version $version."
          }

          $ghDir = $gh.Directory.FullName
          $env:PATH = "$ghDir;$env:PATH"
          [IO.File]::AppendAllText($env:GITHUB_PATH, ($ghDir + [Environment]::NewLine), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Using verified GitHub CLI $version with SHA-256 $expectedSha256."

      - name: Confirm release source is still canonical main
        id: release_freshness
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Repository token was not supplied to the release freshness guard.'
          }

          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='mhw-mod-manager-release-freshness'
          }
          $mainRef=Invoke-RestMethod -UseBasicParsing -Method Get -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" -TimeoutSec 60
          $remoteMain=[string]$mainRef.object.sha
          if ([string]::IsNullOrWhiteSpace($remoteMain) -or $remoteMain.Length -ne 40 -or $remoteMain -match '[^0-9a-fA-F]') {
            throw "Release freshness guard received malformed main SHA '$remoteMain'."
          }

          if (-not [string]::Equals($remoteMain,$env:GITHUB_SHA,[StringComparison]::OrdinalIgnoreCase)) {
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "::notice::Skipping updater publication for stale source $env:GITHUB_SHA because canonical main is $remoteMain."
            exit 0
          }

          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "PASS: release source $env:GITHUB_SHA is still canonical main." -ForegroundColor Green

      - name: Resolve release artifact provenance subject
        id: release_artifact
        if: success() && github.ref == 'refs/heads/main' && steps.release_freshness.outputs.publish == 'true'
        shell: powershell
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PRIVATE_ATTESTATIONS_ENABLED: ${{ vars.MHW_ENABLE_GITHUB_ATTESTATIONS }}
        run: |
          $manifestPath = '.\artifacts\update-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Release provenance requires $manifestPath."
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $artifactName = [string]$manifest.artifactName
          $expectedHash = ([string]$manifest.sha256).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($artifactName) -or
              [IO.Path]::GetFileName($artifactName) -ne $artifactName -or
              -not $artifactName.EndsWith('.zip',[StringComparison]::OrdinalIgnoreCase)) {
            throw "Release provenance received unsafe artifact name '$artifactName'."
          }
          if ($expectedHash.Length -ne 64 -or $expectedHash -match '[^0-9a-f]') {
            throw "Release provenance received malformed SHA-256 '$expectedHash'."
          }

          $artifactPath = Join-Path '.\artifacts' $artifactName
          if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
            throw "Release provenance artifact does not exist: $artifactPath"
          }
          $actualHash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Release provenance artifact digest mismatch. Manifest=$expectedHash Actual=$actualHash"
          }

          $private = [string]::Equals([string]$env:REPOSITORY_PRIVATE,'true',[StringComparison]::OrdinalIgnoreCase)
          $privateEnabled = [string]::Equals([string]$env:PRIVATE_ATTESTATIONS_ENABLED,'true',[StringComparison]::OrdinalIgnoreCase)
          $shouldAttest = (-not $private) -or $privateEnabled

          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_digest=sha256:$actualHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "attest=$($shouldAttest.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($shouldAttest) {
            Add-Content -LiteralPath 'BuildLogs\ci-windows-provenance.txt' -Value 'github_artifact_attestation=requested'
          } else {
            Add-Content -LiteralPath 'BuildLogs\ci-windows-provenance.txt' -Value 'github_artifact_attestation=skipped_private_repo_requires_enterprise_cloud_and_MHW_ENABLE_GITHUB_ATTESTATIONS=true'
            Write-Host '::notice::GitHub artifact attestation skipped for private repository. Enable MHW_ENABLE_GITHUB_ATTESTATIONS=true only on a supported GitHub Enterprise Cloud repository.'
          }

      - name: Attest release artifact provenance
        id: release_attestation
        if: success() && steps.release_artifact.outputs.attest == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release_artifact.outputs.artifact_name }}
          subject-digest: ${{ steps.release_artifact.outputs.artifact_digest }}

      - name: Verify release artifact provenance
        if: success() && steps.release_artifact.outputs.attest == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.release_artifact.outputs.artifact_name }}
        run: |
          $artifactPath = Join-Path '.\artifacts' $env:ARTIFACT_NAME
          gh attestation verify $artifactPath --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub build-provenance attestation verification failed.'
          }

      - name: Record release provenance status
        if: success() && steps.release_artifact.outcome == 'success'
        shell: powershell
        env:
          SHOULD_ATTEST: ${{ steps.release_artifact.outputs.attest }}
          ATTESTATION_ID: ${{ steps.release_attestation.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.release_attestation.outputs.attestation-url }}
        run: |
          if ($env:SHOULD_ATTEST -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:ATTESTATION_ID) -or [string]::IsNullOrWhiteSpace($env:ATTESTATION_URL)) {
              throw 'Attestation was required but the action did not return its identity and URL.'
            }
            Add-Content -LiteralPath 'BuildLogs\ci-windows-provenance.txt' -Value 'github_artifact_attestation=verified'
            Add-Content -LiteralPath 'BuildLogs\ci-windows-provenance.txt' -Value ("github_artifact_attestation_id=" + $env:ATTESTATION_ID)
            Add-Content -LiteralPath 'BuildLogs\ci-windows-provenance.txt' -Value ("github_artifact_attestation_url=" + $env:ATTESTATION_URL)
          }
      - name: Publish public updater client feed
        if: success() && github.ref == 'refs/heads/main' && steps.release_freshness.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MHW_PUBLIC_RELEASE_TOKEN: ${{ secrets.MHW_PUBLIC_RELEASE_TOKEN }}
        run: |
          # The installed app consumes the public feed, so make it ready before
          # exposing the same release in the canonical/private repository.
          .\scripts\release\Publish-PublicUpdaterRelease.ps1 -ManifestPath ".\artifacts\update-manifest.json"

      - name: Publish immutable canonical updater release
        if: success() && github.ref == 'refs/heads/main' && steps.release_freshness.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\release\Publish-UpdaterRelease.ps1 -ManifestPath ".\artifacts\update-manifest.json"

      - name: Verify public and canonical updater release parity
        if: success() && github.ref == 'refs/heads/main' && steps.release_freshness.outputs.publish == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest=Get-Content -LiteralPath ".\artifacts\update-manifest.json" -Raw | ConvertFrom-Json
          $tag="updater-main-$([long]$manifest.buildNumber)"
          $headers=@{
            Accept='application/vnd.github+json'
            Authorization="Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='mhw-mod-manager-release-parity'
          }
          $private=Invoke-RestMethod -UseBasicParsing -Method Get -Headers $headers -Uri "https://api.github.com/repos/fengie/mhw-mods/releases/tags/$tag" -TimeoutSec 60
          $headers.Remove('Authorization')
          $public=Invoke-RestMethod -UseBasicParsing -Method Get -Headers $headers -Uri "https://api.github.com/repos/fengie/mhw-mod-manager-release/releases/tags/$tag" -TimeoutSec 60

          foreach($release in @($private,$public)){
            if([bool]$release.draft -or [bool]$release.prerelease -or -not [bool]$release.immutable){
              throw "Updater parity failed: $($release.html_url) is not published immutable stable."
            }
          }
          if(([string]$private.target_commitish).ToLowerInvariant() -ne ([string]$manifest.sourceSha).ToLowerInvariant()){
            throw "Updater parity failed: canonical release source does not match manifest source."
          }

          $expectedNames=@([string]$manifest.artifactName,'update-manifest.json')
          foreach($name in $expectedNames){
            $privateAsset=@($private.assets | Where-Object {[string]$_.name -eq $name})
            $publicAsset=@($public.assets | Where-Object {[string]$_.name -eq $name})
            if($privateAsset.Count -ne 1 -or $publicAsset.Count -ne 1){
              throw "Updater parity failed: exact asset $name is not present once in both releases."
            }
            if([long]$privateAsset[0].size -ne [long]$publicAsset[0].size){
              throw "Updater parity failed: asset $name size differs between canonical and public feeds."
            }
            if([string]$privateAsset[0].digest -ne [string]$publicAsset[0].digest){
              throw "Updater parity failed: asset $name digest differs between canonical and public feeds."
            }
          }
          Write-Host "PASS: updater release $tag is identical and immutable in public and canonical feeds." -ForegroundColor Green

      - name: Preserve verification, build, and promoted-cache evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release-evidence-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
          path: |
            BuildLogs/**
            artifacts/**/*.json
            release/**/*.json
            .verification/function-status.json
            .verification/stage-status.json
            MHW-DEBUG-ALL.log

      - name: Persist promoted verification state
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Repository token was not supplied to the verification-state persistence step.'
          }
          $authBytes = [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN")
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String($authBytes)
          # Verification evidence is exact-input data. Never replay a stale run's promoted
          # cache/evidence commit on top of a newer main revision.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/main before persisting verification state.'
          }
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:GITHUB_SHA) {
            Write-Host "::notice::Skipping verification-state persistence for $env:GITHUB_SHA because main advanced to $remoteMain while this exact gate was running. Exact evidence remains in the uploaded artifact."
            exit 0
          }

          $verify = Get-ChildItem -Path BuildLogs -Filter 'verification-report-*.md' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $build = Get-ChildItem -Path BuildLogs -Filter 'build-release-report-*.txt' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $verify -or -not $build) { throw 'Expected verification/build reports were not produced.' }

          $version = (Get-Content -LiteralPath 'VERSION.txt' -Raw).Trim()
          $evidencePath = "_AGENT_CONTEXT/EVIDENCE/v$version-heaven-windows-closure.log"
          @(
            ("MHW Manual Mod Manager v$version Heaven Windows closure")
            ('source_sha=' + $env:GITHUB_SHA)
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('runner_os=' + $env:RUNNER_OS)
            ('runner_arch=' + $env:RUNNER_ARCH)
            ('dotnet_sdk=' + (& dotnet --version))
            ''
            '=== VERIFICATION REPORT ==='
            (Get-Content -LiteralPath $verify.FullName -Raw)
            ''
            '=== RELEASE BUILD REPORT ==='
            (Get-Content -LiteralPath $build.FullName -Raw)
          ) | Set-Content -LiteralPath $evidencePath -Encoding UTF8

          # Evidence and successor state are one logical transition. The exact tested
          # source remains GITHUB_SHA even though the persistence commit advances main.
          & .\scripts\release\Sync-VerificationContinuity.ps1 -Root (Get-Location).Path -SourceSha $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -EvidencePath $evidencePath
          & .\scripts\testing\Test-AgentHandoff.ps1 -Root (Get-Location).Path

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.verification/function-status.json' '.verification/stage-status.json' $evidencePath '_AGENT_CONTEXT/CURRENT_REVISION.json' '_AGENT_CONTEXT/CURRENT_STATE.md' 'NEXT-AGENT-START-HERE.md'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Persist hosted Windows verification evidence [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the verification evidence commit.' }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              # A concurrent main update between the preflight fetch and this push is benign:
              # this run's exact evidence was already uploaded and must not be rebased forward.
              git fetch origin main
              if ($LASTEXITCODE -ne 0) {
                throw 'Verification evidence was produced, but the failed push could not be diagnosed because origin/main could not be fetched.'
              }
              $remoteMain = (git rev-parse origin/main).Trim()
              if ($remoteMain -ne $env:GITHUB_SHA) {
                Write-Host "::notice::Skipping the local persistence commit because main advanced to $remoteMain during the push race. Exact evidence remains in the uploaded artifact."
                exit 0
              }
              throw "Failed to persist verification state while origin/main still points at exact source $env:GITHUB_SHA."
            }
          } else {
            Write-Host 'Promoted verification state already matches the repository.'
          }
