name: Updater Installed Client E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/updater-installed-client-e2e.yml'
      - 'tests/MhwModManager.IntegrationTests/UpdaterInstalledClientE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdateInstallerTests.cs'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'src/MhwModManager.App/App.xaml.cs'
  pull_request:
    paths:
      - '.github/workflows/updater-installed-client-e2e.yml'
      - 'tests/MhwModManager.IntegrationTests/UpdaterInstalledClientE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdateInstallerTests.cs'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'src/MhwModManager.App/App.xaml.cs'

permissions:
  contents: read

jobs:
  installed-client-e2e:
    name: Real packaged 60 to 61 update and rollback
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '1'
      MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
      MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}\BuildLogs\updater-installed-e2e\evidence.json

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            "candidate_sha=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "dotnet_sdk=$(& dotnet --version)"
            "run_opt_in=$env:MHW_RUN_UPDATER_INSTALLED_E2E"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'provenance.txt') -Encoding UTF8
          if ($env:MHW_RUN_UPDATER_INSTALLED_E2E -ne '1') {
            throw 'Updater installed-client E2E opt-in is not active.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MHW_MOD_MANAGER_GITHUB_TOKEN)) {
            throw 'Repository token was not supplied to the updater E2E.'
          }

      - name: Restore integration test project
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj --source .\data -p:NuGetAudit=false --ignore-failed-sources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integration test project
        shell: powershell
        run: |
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real packaged updater E2E
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $log = Join-Path $evidence 'installed-client-e2e-test.log'
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore --no-build --filter "FullyQualifiedName~UpdaterInstalledClientE2ETests" --logger "console;verbosity=detailed" 2>&1 |
            Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { exit $exit }
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Updater E2E returned success without producing evidence.json.'
          }

      - name: Re-run focused rollback regression guards
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $log = Join-Path $evidence 'rollback-regression-tests.log'
          $filter = "FullyQualifiedName~UpdateInstallerTests.Failure_after_first_replacement_restores_exact_previous_payload|FullyQualifiedName~UpdateInstallerTests.Failure_after_stale_owned_deletion_restores_deleted_and_replaced_files"
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore --no-build --filter $filter --logger "console;verbosity=detailed" 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect updater runtime log
        if: always()
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $runtimeLog = Join-Path $env:LOCALAPPDATA 'MhwModManager\Updater\updater.log'
          if (Test-Path -LiteralPath $runtimeLog) {
            Copy-Item -LiteralPath $runtimeLog -Destination (Join-Path $evidence 'updater-runtime.log') -Force
          }

      - name: Upload installed-client E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-installed-client-e2e-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ github.workspace }}\BuildLogs\updater-installed-e2e\**
