name: One-shot superseded branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-superseded-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-reconciliation-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, heaven-v2]
    steps:
      - name: Delete only branches already integrated into main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const info = await github.rest.repos.get({ owner, repo });
            if (info.data.default_branch !== "main") {
              core.setFailed(`Default branch is ${info.data.default_branch}; refusing cleanup`);
              return;
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });

            const deleted = [];
            const preserved = [];

            // Exact-tip approvals for work already salvaged, merged, or explicitly
            // superseded by canonical main. These are intentionally SHA-pinned:
            // if another agent moves a branch, cleanup preserves it for re-audit.
            const approvedSuperseded = new Map([
              ["agent/liveness-scheduler-machine-policy-20260929", { sha: "61c7714822d56084f11b7b4b7838b827648b408e", reason: "merged PR #96" }],
              ["agent/updater-cross-session-ownership-20260929", { sha: "fcc30786b5230eac81094aa0d42c7efc0fa2214e", reason: "integrated on canonical main" }],
              ["agent/replacefilew-failure-characterization-20260927", { sha: "78fc8939331fc6a5d9bad23dbf1c38708530785e", reason: "historical implementation already integrated and verified" }],
              ["agent/replacefilew-failure-characterization-v2", { sha: "a5731ebcf1a0c5a4a92d1adbce5899766d6c5e8b", reason: "historical implementation already integrated and verified" }],
              ["agent/windows-live-containment-hardening", { sha: "02cbd35f5c941f0f0dd912398bc856593e2583ce", reason: "historical implementation already integrated and verified" }],
              ["agent/windows-live-containment-hardening-v2", { sha: "6b4e57004d16aec99064ecf475bcb3c4ef566f32", reason: "historical implementation already integrated and verified" }],
              ["agent/support-bundle-share-safety-20260928", { sha: "ef4c2e72339b85c1d152abd76648360143a4266f", reason: "support harvest already canonical" }],
              ["agent/support-continuity-drift-reconciliation-20260928", { sha: "93dd7db71941ae4a11c6d59502d0f6d6954c293b", reason: "stale continuity snapshot" }],
              ["agent/support-continuity-drift-repair-20260928", { sha: "ae8190b8b0b9a47b5dca1b1343775017e6bdae88", reason: "stale continuity snapshot" }],
              ["agent/support-pr-disposition-ledger-20260928", { sha: "d193cd7b3b1be769c2becfb8c0924ed76ae9077f", reason: "stale support ledger snapshot" }],
              ["agent/support-updater-c10-manager-review-20260928", { sha: "5d1dda9c20e475a80cd90c9bd405d6c9337ddc4f", reason: "superseded updater audit" }],
              ["agent/support-updater-lr003-native-replacement-20260928", { sha: "109e4f63e50f96365091931dd44613865b643d8d", reason: "superseded updater audit" }],
              ["agent/support-updater-lr003-restart-audit-20260928", { sha: "882f5a916c201802b87f67dbd8577074839c67d5", reason: "superseded updater audit" }],
              ["agent/support-updater-lr003-resume-20260928", { sha: "bf4bbf1cabefa965a1c291989a6000f9be43801d", reason: "superseded updater audit" }],
              ["agent/support-updater-packaging-audit-20260928", { sha: "473109ff076a5c0e9da493c50cece4ba6529b0e8", reason: "superseded updater audit" }],
              ["agent/support-updater-wpf-integration-audit-20260928", { sha: "d37b348c18d303c5644ac141661ff1b48291e41f", reason: "superseded updater audit" }],
              ["agent/updater-existing-release-rest-ref-20260928", { sha: "04a985054cf2ea3fdbb1b50eaf3c16c00e3392a4", reason: "superseded by canonical updater closure" }],
              ["agent/updater-existing-release-rest-ref-gate-20260928", { sha: "febda8bdfd8af52bf432c3f80bcadc6de527bae1", reason: "temporary verification mirror" }],
              ["agent/updater-existing-release-rest-ref-gate2-20260928", { sha: "d7a57c4d3d91c7df74f34c15059e11ec8702ca49", reason: "temporary verification mirror" }],

              ["agent/smart-pack-planner-core", { sha: "ddcbe89839501e0689d6b2972cd972426201649b", reason: "useful delta salvaged by merged PR #125" }],
              ["integration/smart-pack-planner-main-20260929", { sha: "54b9219f4e02013b67369dc7bff2a902e64dc03f", reason: "superseded by fresh-main PR #125" }],
              ["agent/updater-installed-e2e-20260929-manager", { sha: "9dca0f2ba007b2489c8b26241274e9b5962277db", reason: "older E2E harness superseded by stronger canonical main E2E" }],
              ["agent/bridge-priority-scheduler-20260929", { sha: "6fb237790f49a65c8a68220e1b2872187655f9a6", reason: "useful priority aging reconciled by merged PR #129" }],
              ["integration/bridge-priority-aging-main-20260929", { sha: "6a3074831612179d8115d238593f62ff5885abc3", reason: "superseded by rebased merged PR #129" }],
              ["agent/hcp-index-wiring-20260929", { sha: "b2ca4d8e75b7c1de48b7b403ac35c7a0bed5a023", reason: "superseded by merged HCP v0.4.0 integration PR #153" }],
              ["integration/hcp-index-wiring-20260929", { sha: "b4b5a2e58d37b4f6638af4516c08f381192e1d46", reason: "superseded by merged HCP v0.4.0 integration PR #153" }]
            ]);

            for (const branchInfo of branches) {
              const branch = branchInfo.name;
              if (branch === "main" || branch === "heaven-bridge") continue;

              let ref;
              try {
                ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (e) {
                if (e.status === 404) {
                  preserved.push({ branch, reason: "already absent" });
                  continue;
                }
                throw e;
              }

              const branchSha = ref.data.object.sha;
              const detail = await github.rest.repos.getBranch({ owner, repo, branch });
              if (detail.data.protected) {
                preserved.push({ branch, sha: branchSha, reason: "protected" });
                continue;
              }

              const open = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                head: `${owner}:${branch}`,
                per_page: 100
              });
              if (open.data.length) {
                preserved.push({
                  branch,
                  sha: branchSha,
                  reason: `open-pr-${open.data[0].number}`
                });
                continue;
              }

              const mainRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
              const mainSha = mainRef.data.object.sha;

              let safe = false;
              let reason = "";

              // Exact commit ancestry is the strongest proof: the branch tip itself
              // is already reachable from the current canonical main.
              const ancestry = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${branchSha}...${mainSha}`
              });
              if (ancestry.data.behind_by === 0) {
                safe = true;
                reason = "tip-ancestor-of-main";
              }

              // Squash/rebase merges can leave the original branch commits outside
              // main's ancestry. Accept those only when the *current branch tip*
              // exactly matches a PR head that GitHub records as merged to main,
              // and that PR's merge commit is itself still reachable from main.
              if (!safe) {
                const closed = await github.paginate(github.rest.pulls.list, {
                  owner,
                  repo,
                  state: "closed",
                  base: "main",
                  head: `${owner}:${branch}`,
                  per_page: 100
                });

                for (const pr of closed) {
                  if (!pr.merged_at || !pr.merge_commit_sha || pr.head?.sha !== branchSha) {
                    continue;
                  }

                  const latestMain = await github.rest.git.getRef({
                    owner, repo, ref: "heads/main"
                  });
                  const mergeReachability =
                    await github.rest.repos.compareCommitsWithBasehead({
                      owner,
                      repo,
                      basehead: `${pr.merge_commit_sha}...${latestMain.data.object.sha}`
                    });

                  if (mergeReachability.data.behind_by === 0) {
                    safe = true;
                    reason = `merged-pr-${pr.number}`;
                    break;
                  }
                }
              }

              if (!safe) {
                const approval = approvedSuperseded.get(branch);
                if (approval && approval.sha === branchSha) {
                  safe = true;
                  reason = `approved-superseded: ${approval.reason}`;
                }
              }

              if (!safe) {
                preserved.push({
                  branch,
                  sha: branchSha,
                  reason: approvedSuperseded.has(branch)
                    ? "approved-tip-changed-requires-reaudit"
                    : "unique-or-unproven"
                });
                continue;
              }

              // Race guard: never delete a branch that moved after it was audited.
              const latest = await github.rest.git.getRef({
                owner, repo, ref: `heads/${branch}`
              });
              if (latest.data.object.sha !== branchSha) {
                preserved.push({
                  branch,
                  sha: latest.data.object.sha,
                  reason: "moved-during-audit"
                });
                continue;
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`
              });

              try {
                await github.rest.git.getRef({
                  owner, repo, ref: `heads/${branch}`
                });
                core.setFailed(`Deletion verification failed for ${branch}`);
                return;
              } catch (e) {
                if (e.status !== 404) throw e;
              }

              deleted.push({ branch, sha: branchSha, reason });
            }

            const finalBranches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });

            core.info(`DELETED_JSON=${JSON.stringify(deleted)}`);
            core.info(`PRESERVED_JSON=${JSON.stringify(preserved)}`);
            core.info(`FINAL_BRANCH_COUNT=${finalBranches.length}`);

            await core.summary
              .addHeading("Branch reconciliation cleanup")
              .addCodeBlock(JSON.stringify({
                deleted,
                preserved,
                finalBranchCount: finalBranches.length
              }, null, 2), "json")
              .write();
