name: Temporary Heaven2 Bootstrap Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heaven2-bootstrap-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 5
    steps:
      - name: Probe heaven2 from heaven
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "runner_machine=$env:COMPUTERNAME"
          $ping = Test-Connection -ComputerName heaven2 -Count 1 -Quiet -ErrorAction SilentlyContinue
          Write-Host "ping=$ping"

          try {
            $resolved = [System.Net.Dns]::GetHostAddresses('heaven2') | ForEach-Object { $_.IPAddressToString }
            Write-Host ("dns=" + ($resolved -join ','))
          } catch {
            Write-Host ("dns_error=" + $_.Exception.Message)
          }

          try {
            $ws = Test-WSMan -ComputerName heaven2 -ErrorAction Stop
            Write-Host "winrm=True"
            Write-Host ("winrm_product=" + $ws.ProductVersion)
          } catch {
            Write-Host "winrm=False"
            Write-Host ("winrm_error=" + $_.Exception.Message)
          }

          try {
            $admin = Test-Path '\\heaven2\C$' -ErrorAction Stop
            Write-Host "admin_share=$admin"
          } catch {
            Write-Host "admin_share=False"
            Write-Host ("admin_share_error=" + $_.Exception.Message)
          }

          try {
            $connections = Get-SmbConnection -ServerName heaven2 -ErrorAction Stop |
              Select-Object ServerName,ShareName,UserName,Encrypted
            if ($connections) {
              Write-Host "smb_existing=True"
              $connections | ConvertTo-Json -Compress | Write-Host
            } else {
              Write-Host "smb_existing=False"
            }
          } catch {
            Write-Host "smb_existing=False"
            Write-Host ("smb_error=" + $_.Exception.Message)
          }
