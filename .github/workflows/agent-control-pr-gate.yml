name: Agent Control PR Gate

on:
  pull_request:
    paths:
      - "tools/agent-control/**"
      - ".github/workflows/agent-control-pr-gate.yml"
  push:
    branches:
      - "main"
      - "feature/agent-control-plane-v2-20260928"
    paths:
      - "tools/agent-control/**"
      - ".github/workflows/agent-control-pr-gate.yml"

permissions:
  contents: read

jobs:
  node-verification:
    name: Node verification on Heaven
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/agent-control
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Syntax checks
        run: npm run check

      - name: Deterministic Agent Control tests
        run: npm test
