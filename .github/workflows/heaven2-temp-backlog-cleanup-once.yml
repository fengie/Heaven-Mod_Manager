name: Heaven2 Temp Backlog Cleanup One-Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heaven2-temp-backlog-cleanup-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven2-temp-backlog-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    name: Purge stale temp backlog on heaven2
    runs-on: [self-hosted, Windows, X64, heaven-v2]
    timeout-minutes: 20
    steps:
      - name: Safely remove stale known scratch roots
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Format-Bytes([long]$Bytes) {
            if ($Bytes -ge 1TB) { return ('{0:N2} TB' -f ($Bytes / 1TB)) }
            if ($Bytes -ge 1GB) { return ('{0:N2} GB' -f ($Bytes / 1GB)) }
            if ($Bytes -ge 1MB) { return ('{0:N2} MB' -f ($Bytes / 1MB)) }
            if ($Bytes -ge 1KB) { return ('{0:N2} KB' -f ($Bytes / 1KB)) }
            return "$Bytes B"
          }

          function Get-TreeBytes([string]$Path) {
            try {
              $m = Get-ChildItem -LiteralPath $Path -Force -File -Recurse -ErrorAction SilentlyContinue |
                Measure-Object -Property Length -Sum
              return [long]($m.Sum)
            } catch {
              return 0L
            }
          }

          function Test-ProcessReference([string]$Path, [string[]]$CommandLines) {
            $needle = [IO.Path]::GetFullPath($Path).TrimEnd('\').ToLowerInvariant()
            foreach ($line in $CommandLines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line.ToLowerInvariant().Contains($needle)) { return $true }
            }
            return $false
          }

          function Test-GitEvidenceSafe([string]$Root) {
            $markers = @(
              Get-ChildItem -LiteralPath $Root -Force -Filter '.git' -Recurse -Depth 2 -ErrorAction SilentlyContinue
            )
            if ($markers.Count -eq 0) { return [pscustomobject]@{ Safe = $true; Reason = 'no-git-marker' } }

            $git = Get-Command git.exe -ErrorAction SilentlyContinue
            if (-not $git) { return [pscustomobject]@{ Safe = $false; Reason = 'git-marker-but-git-unavailable' } }

            foreach ($marker in $markers) {
              $repo = Split-Path -Parent $marker.FullName
              $status = @(& $git.Source -C $repo status --porcelain --untracked-files=normal 2>$null)
              if ($LASTEXITCODE -ne 0) {
                return [pscustomobject]@{ Safe = $false; Reason = "git-status-failed:$repo" }
              }
              if ($status.Count -gt 0) {
                return [pscustomobject]@{ Safe = $false; Reason = "git-dirty:$repo" }
              }

              $head = ((& $git.Source -C $repo rev-parse HEAD 2>$null) -join '').Trim()
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
                return [pscustomobject]@{ Safe = $false; Reason = "git-head-unresolved:$repo" }
              }
              $remoteContaining = @(& $git.Source -C $repo branch -r --contains $head 2>$null | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              if ($LASTEXITCODE -ne 0 -or $remoteContaining.Count -eq 0) {
                return [pscustomobject]@{ Safe = $false; Reason = "git-head-not-on-remote-tracking-ref:$repo" }
              }
            }
            return [pscustomobject]@{ Safe = $true; Reason = 'git-clean-and-remotely-tracked' }
          }

          $tempRoot = [IO.Path]::GetFullPath($env:TEMP).TrimEnd('\')
          if (-not (Test-Path -LiteralPath $tempRoot -PathType Container)) {
            throw "TEMP root does not exist: $tempRoot"
          }

          $profile = [IO.Path]::GetFullPath($env:USERPROFILE).TrimEnd('\')
          if (-not $tempRoot.StartsWith($profile, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing cleanup because TEMP is outside USERPROFILE: $tempRoot"
          }

          $driveId = [IO.Path]::GetPathRoot($tempRoot).TrimEnd('\')
          $diskBefore = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveId'" -ErrorAction SilentlyContinue
          $freeBefore = if ($diskBefore) { [long]$diskBefore.FreeSpace } else { 0L }

          $cutoff = [DateTime]::UtcNow.AddHours(-12)
          $namePattern = '^(?i)(MhwManagerSelfTest-|MhwAgentControlSelfTest-|mhw-|mhwm-|chatgpt-|agent-control-|shipit-|heaven-toolbox-|DiagOutputDir$)'
          $commandLines = @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              ForEach-Object { [string]$_.CommandLine } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          $candidates = @(
            Get-ChildItem -LiteralPath $tempRoot -Force -Directory -ErrorAction Stop |
              Where-Object {
                $_.Name -match $namePattern -and
                $_.LastWriteTimeUtc -lt $cutoff
              } |
              Sort-Object LastWriteTimeUtc
          )

          $deleted = New-Object System.Collections.Generic.List[object]
          $skipped = New-Object System.Collections.Generic.List[object]
          [long]$reclaimed = 0

          Write-Host "TEMP_ROOT=$tempRoot"
          Write-Host "CUTOFF_UTC=$($cutoff.ToString('o'))"
          Write-Host "CANDIDATE_COUNT=$($candidates.Count)"

          foreach ($dir in $candidates) {
            $full = [IO.Path]::GetFullPath($dir.FullName).TrimEnd('\')
            $parent = [IO.Path]::GetFullPath((Split-Path -Parent $full)).TrimEnd('\')

            if (-not [string]::Equals($parent, $tempRoot, [StringComparison]::OrdinalIgnoreCase)) {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = 'not-immediate-child-of-temp' })
              continue
            }
            if (($dir.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = 'reparse-point' })
              continue
            }
            if ($full -match '(?i)\.vhdx$' -or $dir.Name -match '(?i)wsl|ubuntu|canonical') {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = 'wsl-protection' })
              continue
            }
            if (Test-ProcessReference -Path $full -CommandLines $commandLines) {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = 'referenced-by-live-process-command-line' })
              continue
            }

            $gitSafety = Test-GitEvidenceSafe -Root $full
            if (-not $gitSafety.Safe) {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = $gitSafety.Reason })
              continue
            }

            $bytes = Get-TreeBytes -Path $full
            $removed = $false
            $lastError = $null
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Remove-Item -LiteralPath $full -Recurse -Force -ErrorAction Stop
                $removed = -not (Test-Path -LiteralPath $full)
                if ($removed) { break }
              } catch {
                $lastError = $_.Exception.Message
              }
              Start-Sleep -Milliseconds (250 * $attempt)
            }

            if ($removed) {
              $reclaimed += $bytes
              $deleted.Add([pscustomobject]@{ Name = $dir.Name; Bytes = $bytes; Git = $gitSafety.Reason })
              Write-Host ("DELETED name='{0}' size='{1}' git='{2}'" -f $dir.Name,(Format-Bytes $bytes),$gitSafety.Reason)
            } else {
              $skipped.Add([pscustomobject]@{ Name = $dir.Name; Reason = "delete-failed:$lastError" })
              Write-Host ("SKIPPED name='{0}' reason='delete-failed'" -f $dir.Name)
            }
          }

          $diskAfter = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveId'" -ErrorAction SilentlyContinue
          $freeAfter = if ($diskAfter) { [long]$diskAfter.FreeSpace } else { 0L }
          $freeDelta = [Math]::Max(0L, $freeAfter - $freeBefore)

          Write-Host "DELETED_COUNT=$($deleted.Count)"
          Write-Host "SKIPPED_COUNT=$($skipped.Count)"
          Write-Host "MEASURED_RECLAIMED=$(Format-Bytes $reclaimed)"
          Write-Host "DISK_FREE_DELTA=$(Format-Bytes $freeDelta)"

          foreach ($row in $skipped) {
            Write-Host ("SKIP_DETAIL name='{0}' reason='{1}'" -f $row.Name,$row.Reason)
          }

          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Heaven2 temp backlog cleanup"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Temp root: `$tempRoot`"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Cutoff: `$($cutoff.ToString('o'))`"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Deleted roots: **$($deleted.Count)**"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Skipped roots: **$($skipped.Count)**"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Measured bytes in deleted roots: **$(Format-Bytes $reclaimed)**"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Disk free-space increase: **$(Format-Bytes $freeDelta)**"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "WSL virtual disks and unrelated app/user data were outside the allowlist."
          }
