name: Updater Regression and Manual E2E

on:
  workflow_dispatch:
    inputs:
      target_build:
        description: 'Exact published updater build to test from immutable build 60 (leave blank for regression-only)'
        required: false
        type: string
      target_source:
        description: 'Exact published source SHA for target_build (leave blank for regression-only)'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/updater-installed-client-e2e.yml'
      - 'scripts/Build-Release.ps1'
      - 'scripts/Test-UpdaterPackage.ps1'
      - 'tests/MhwModManager.IntegrationTests/MhwModManager.IntegrationTests.csproj'
      - 'tests/MhwModManager.IntegrationTests/UpdaterGitHubAssetDownloadTests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdaterInstalledClientE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdateInstallerTests.cs'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'src/MhwModManager.App/App.xaml.cs'

permissions:
  contents: read

jobs:
  updater-regression-on-heaven:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target_build == '' && inputs.target_source == '') }}
    name: Updater regression on Heaven
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '0'
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven updater regression runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Restore integration tests
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integration tests
        shell: powershell
        run: |
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run updater GitHub and BOM regressions
        shell: powershell
        run: |
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) { throw "Missing test runner: $runner" }
          $stdout = Join-Path $env:RUNNER_TEMP 'updater-regression.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'updater-regression.stderr.log'
          Remove-Item -LiteralPath $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $runner `
            -ArgumentList @('--filter-class', 'MhwModManager.IntegrationTests.UpdaterGitHubAssetDownloadTests') `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

  manual-installed-client-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_build != '' && inputs.target_source != '' }}
    name: Manual build-60 to exact release E2E
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '1'
      MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
      MHW_E2E_TARGET_BUILD: ${{ inputs.target_build }}
      MHW_E2E_TARGET_SOURCE: ${{ inputs.target_source }}
      MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}\BuildLogs\updater-installed-e2e\evidence.json
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven updater E2E runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Restore and build integration tests
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real installed-client update and rollback
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) { throw "Missing test runner: $runner" }
          $stdout = Join-Path $evidence 'installed-client-e2e.stdout.log'
          $stderr = Join-Path $evidence 'installed-client-e2e.stderr.log'
          Remove-Item -LiteralPath $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $runner `
            -ArgumentList @('--filter-class', 'MhwModManager.IntegrationTests.UpdaterInstalledClientE2ETests') `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $doc = Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($doc.status -eq 'FAIL' -or $doc.scenarioA.status -ne 'PASS' -or $doc.scenarioB.status -ne 'PASS') {
            throw 'Installed-client updater E2E evidence is not fully green.'
          }

      - name: Upload installed-client E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-installed-client-e2e-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ github.workspace }}\BuildLogs\updater-installed-e2e\**
