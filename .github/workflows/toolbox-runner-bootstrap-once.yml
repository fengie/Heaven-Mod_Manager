name: Bootstrap Toolbox Runner Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolbox-runner-bootstrap-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolbox-runner-bootstrap-once
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Register Toolbox runner on Heaven
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 15
    steps:
      - name: Register and start isolated Toolbox runner
        shell: powershell
        env:
          TOOLBOX_RUNNER_BOOTSTRAP_TOKEN: ${{ secrets.TOOLBOX_RUNNER_BOOTSTRAP_TOKEN }}
          MHW_PUBLIC_RELEASE_TOKEN: ${{ secrets.MHW_PUBLIC_RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $targetRepo = 'fengie/heaven-toolbox'
          $targetUrl = "https://github.com/$targetRepo"
          $runnerName = 'heaven-toolbox'
          $runnerLabel = 'heaven-toolbox'
          $runnerRoot = 'C:\actions-runner-toolbox'
          $api = "https://api.github.com/repos/$targetRepo"
          $commonHeaders = @{
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'heaven-toolbox-runner-bootstrap'
          }

          function Add-Mask([string]$Value) {
            if (-not [string]::IsNullOrWhiteSpace($Value)) {
              Write-Host "::add-mask::$Value"
            }
          }

          function Get-StatusCode($ErrorRecord) {
            try {
              return [int]$ErrorRecord.Exception.Response.StatusCode
            } catch {
              return 0
            }
          }

          function Test-TargetAdminToken([string]$Token, [string]$Source) {
            if ([string]::IsNullOrWhiteSpace($Token)) { return $null }
            $Token = $Token.Trim()
            Add-Mask $Token
            $headers = @{} + $commonHeaders
            $headers.Authorization = "Bearer $Token"
            try {
              $null = Invoke-RestMethod -Method Get -Uri "$api/actions/runners?per_page=1" -Headers $headers
              Write-Host "TARGET_AUTH_ACCEPTED source=$Source"
              return [pscustomobject]@{ Token = $Token; Source = $Source; Headers = $headers }
            } catch {
              Write-Host "TARGET_AUTH_REJECTED source=$Source status=$(Get-StatusCode $_)"
              return $null
            }
          }

          $auth = Test-TargetAdminToken $env:TOOLBOX_RUNNER_BOOTSTRAP_TOKEN 'toolbox-bootstrap-secret'
          if (-not $auth) {
            $auth = Test-TargetAdminToken $env:MHW_PUBLIC_RELEASE_TOKEN 'existing-release-secret'
          }
          if (-not $auth -and (Get-Command gh -ErrorAction SilentlyContinue)) {
            $ghToken = ''
            try {
              $ghToken = ((& gh auth token 2>$null) -join '').Trim()
            } catch {
              $ghToken = ''
            }
            $auth = Test-TargetAdminToken $ghToken 'machine-local-gh-auth'
          }
          if (-not $auth -and (Get-Command git -ErrorAction SilentlyContinue)) {
            $savedTerminalPrompt = $env:GIT_TERMINAL_PROMPT
            $savedGcmInteractive = $env:GCM_INTERACTIVE
            try {
              $env:GIT_TERMINAL_PROMPT = '0'
              $env:GCM_INTERACTIVE = 'Never'
              $gitPath = (Get-Command git -ErrorAction Stop).Source
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = $gitPath
              $psi.Arguments = 'credential fill'
              $psi.UseShellExecute = $false
              $psi.RedirectStandardInput = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.CreateNoWindow = $true
              $proc = New-Object System.Diagnostics.Process
              $proc.StartInfo = $psi
              $null = $proc.Start()
              $proc.StandardInput.WriteLine('protocol=https')
              $proc.StandardInput.WriteLine('host=github.com')
              $proc.StandardInput.WriteLine('')
              $proc.StandardInput.Close()
              $filledText = $proc.StandardOutput.ReadToEnd()
              $credentialError = $proc.StandardError.ReadToEnd()
              $proc.WaitForExit()
              if ($proc.ExitCode -ne 0) {
                Write-Host "GIT_CREDENTIAL_UNAVAILABLE exit=$($proc.ExitCode)"
                $filled = @()
              } else {
                $filled = @($filledText -split "\r?\n")
              }
              $passwordLine = @($filled | Where-Object { $_ -like 'password=*' } | Select-Object -First 1)
              $gitToken = if ($passwordLine.Count -eq 1) {
                [string]$passwordLine[0].Substring('password='.Length)
              } else {
                ''
              }
              $auth = Test-TargetAdminToken $gitToken 'machine-local-git-credential-manager'
              $gitToken = ''
              $filled = $null
            } finally {
              $env:GIT_TERMINAL_PROMPT = $savedTerminalPrompt
              $env:GCM_INTERACTIVE = $savedGcmInteractive
            }
          }
          if (-not $auth) {
            throw 'No already-authorized machine/account credential can administer Actions runners for fengie/heaven-toolbox. No credential was printed or persisted.'
          }

          $registered = Invoke-RestMethod -Method Get -Uri "$api/actions/runners?per_page=100" -Headers $auth.Headers
          $existing = @($registered.runners | Where-Object { $_.name -eq $runnerName })
          if ($existing.Count -gt 0 -and $existing[0].status -eq 'online') {
            Write-Output "TOOLBOX_RUNNER_ALREADY_ONLINE id=$($existing[0].id)"
            exit 0
          }

          $registration = Invoke-RestMethod -Method Post -Uri "$api/actions/runners/registration-token" -Headers $auth.Headers
          if ([string]::IsNullOrWhiteSpace([string]$registration.token)) {
            throw 'GitHub did not return a Toolbox runner registration token.'
          }
          Add-Mask ([string]$registration.token)

          $releaseHeaders = @{} + $commonHeaders
          $release = Invoke-RestMethod -Method Get -Uri 'https://api.github.com/repos/actions/runner/releases/latest' -Headers $releaseHeaders
          $version = ([string]$release.tag_name).TrimStart('v')
          $assetName = "actions-runner-win-x64-$version.zip"
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1)
          if ($asset.Count -ne 1) {
            throw "Unable to resolve official GitHub Actions runner asset $assetName."
          }

          New-Item -ItemType Directory -Force -Path $runnerRoot | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest -UseBasicParsing -Uri $asset[0].browser_download_url -OutFile $archive

          if (-not [string]::IsNullOrWhiteSpace([string]$asset[0].digest) -and [string]$asset[0].digest -match '^sha256:(?<hash>[0-9a-fA-F]{64})$') {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
            if ($actual -ine $Matches.hash) {
              throw "Official runner archive SHA-256 mismatch for $assetName."
            }
            Write-Output "RUNNER_ARCHIVE_SHA256_VERIFIED version=$version"
          } else {
            Write-Output "RUNNER_ARCHIVE_DIGEST_UNAVAILABLE version=$version source=github-official-release"
          }

          $configured = Join-Path $runnerRoot '.runner'
          if (-not (Test-Path -LiteralPath $configured -PathType Leaf)) {
            Expand-Archive -LiteralPath $archive -DestinationPath $runnerRoot -Force

            $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
            $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            Push-Location $runnerRoot
            try {
              $args = @(
                '--unattended',
                '--url', $targetUrl,
                '--token', [string]$registration.token,
                '--name', $runnerName,
                '--labels', $runnerLabel,
                '--work', '_work',
                '--replace'
              )
              if ($isAdmin) { $args += '--runasservice' }
              & .\config.cmd @args
              if ($LASTEXITCODE -ne 0) { throw "Toolbox runner config.cmd failed with exit code $LASTEXITCODE." }
            } finally {
              Pop-Location
            }

            if ($isAdmin) {
              $service = @(Get-Service | Where-Object { $_.Name -like 'actions.runner.*heaven-toolbox*' } | Select-Object -First 1)
              if ($service.Count -eq 1 -and $service[0].Status -ne 'Running') {
                Start-Service -Name $service[0].Name
              }
              Write-Output "TOOLBOX_RUNNER_PERSISTENCE mode=windows-service elevated=true"
            } else {
              # GitHub Runner removes descendants carrying this job's tracking id.
              # Clear it only for the second runner process so it can outlive this
              # one-shot trusted bootstrap job; no credential is passed to run.cmd.
              $env:RUNNER_TRACKING_ID = ''
              $log = Join-Path $runnerRoot 'toolbox-runner.log'
              $cmd = '"' + (Join-Path $runnerRoot 'run.cmd') + '" >> "' + $log + '" 2>&1'
              Start-Process -FilePath $env:COMSPEC -ArgumentList '/d','/c',$cmd -WorkingDirectory $runnerRoot -WindowStyle Hidden
              Write-Output "TOOLBOX_RUNNER_PERSISTENCE mode=detached-process elevated=false"
            }
          } else {
            Write-Output 'TOOLBOX_RUNNER_CONFIGURATION already-present'
            $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
            $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            $service = @(Get-Service | Where-Object { $_.Name -like 'actions.runner.*heaven-toolbox*' } | Select-Object -First 1)
            if ($service.Count -eq 1) {
              if ($service[0].Status -ne 'Running') { Start-Service -Name $service[0].Name }
            } else {
              $env:RUNNER_TRACKING_ID = ''
              $log = Join-Path $runnerRoot 'toolbox-runner.log'
              $cmd = '"' + (Join-Path $runnerRoot 'run.cmd') + '" >> "' + $log + '" 2>&1'
              Start-Process -FilePath $env:COMSPEC -ArgumentList '/d','/c',$cmd -WorkingDirectory $runnerRoot -WindowStyle Hidden
            }
          }

          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $state = Invoke-RestMethod -Method Get -Uri "$api/actions/runners?per_page=100" -Headers $auth.Headers
            $runner = @($state.runners | Where-Object { $_.name -eq $runnerName } | Select-Object -First 1)
            if ($runner.Count -eq 1 -and $runner[0].status -eq 'online') {
              $labels = (@($runner[0].labels | ForEach-Object { $_.name }) -join ',')
              Write-Output "TOOLBOX_RUNNER_ONLINE id=$($runner[0].id) name=$runnerName labels=$labels"
              exit 0
            }
          } while ([DateTimeOffset]::UtcNow -lt $deadline)

          throw 'Toolbox runner was registered but did not become online within the bounded verification window.'
