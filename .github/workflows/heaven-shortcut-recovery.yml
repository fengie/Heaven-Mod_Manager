name: Heaven shortcut recovery

on:
  push:
    branches:
      - ops/heaven-bridge-shortcut-recovery-20260929
  pull_request:
    branches:
      - main

jobs:
  recover-and-create-shortcut:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Verify bridge v6
        shell: powershell
        run: |
          python -m py_compile heaven-bridge/worker.py heaven-bridge/test_worker.py heaven-bridge/tests/test_worker.py
          python heaven-bridge/test_worker.py
          python heaven-bridge/tests/test_worker.py

      - name: Refresh local bridge runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeDir = Join-Path $env:USERPROFILE '.mhw-local-tools'
          $runtimeWorker = Join-Path $runtimeDir 'heaven-desktop-worker.py'
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Copy-Item (Resolve-Path 'heaven-bridge\worker.py') $runtimeWorker -Force

          $workers = @(
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*\.mhw-local-tools\heaven-desktop-worker.py*' }
          )
          foreach ($worker in $workers) {
            try { Stop-Process -Id $worker.ProcessId -Force -ErrorAction Stop } catch {}
          }
          Start-Sleep -Seconds 1

          $started = $false
          try {
            Start-ScheduledTask -TaskName 'Heaven Local Bridge' -ErrorAction Stop
            Start-Sleep -Seconds 4
            $started = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*\.mhw-local-tools\heaven-desktop-worker.py*' }).Count -gt 0
          } catch {}

          if (-not $started) {
            $pythonw = (Get-Command pythonw.exe -ErrorAction Stop).Source
            Start-Process -WindowStyle Hidden -FilePath $pythonw -ArgumentList ('"{0}"' -f $runtimeWorker) -WorkingDirectory $env:USERPROFILE | Out-Null
            Start-Sleep -Seconds 4
          }

          $live = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -and $_.CommandLine -like '*\.mhw-local-tools\heaven-desktop-worker.py*' })
          if ($live.Count -lt 1) { throw 'Heaven Local Bridge worker did not restart.' }
          Write-Host "Bridge runtime refreshed; worker count=$($live.Count)"

      - name: Create Agent Control desktop shortcut
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:USERPROFILE 'agent-control-panel'),
            (Join-Path $env:USERPROFILE 'local-ai-workspaces\mhw-mods'),
            (Join-Path $env:USERPROFILE 'OneDrive\Desktop\mods\mod manager folder'),
            (Join-Path $env:USERPROFILE 'Desktop\mods\mod manager folder')
          )
          $repo = $null
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate 'tools\agent-control\Start Agent Control.bat')) {
              $repo = (Resolve-Path $candidate).Path
              break
            }
          }
          if (-not $repo) {
            $hit = Get-ChildItem -Path $env:USERPROFILE -Filter 'Start Agent Control.bat' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\tools\agent-control\Start Agent Control.bat' } |
              Select-Object -First 1
            if ($hit) { $repo = (Resolve-Path (Join-Path $hit.Directory.FullName '..\..')).Path }
          }
          if (-not $repo) { throw 'Could not locate a durable Agent Control repository checkout.' }

          $agentDir = Join-Path $repo 'tools\agent-control'
          $appDir = Join-Path $env:LOCALAPPDATA 'MHW-Agent-Control'
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null

          $launcher = Join-Path $appDir 'Launch-Agent-Control.ps1'
          $launcherText = @"
          `$ErrorActionPreference = 'Stop'
          `$env:AGENT_CONTROL_REPO = '$($repo.Replace("'","''"))'
          Set-Location '$($agentDir.Replace("'","''"))'
          & '.\Start Agent Control.bat'
          "@
          Set-Content -LiteralPath $launcher -Value $launcherText -Encoding UTF8

          $iconPath = Join-Path $appDir 'agent-control.ico'
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 128,128
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $bg = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(28,32,42))
          $ring = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(77,196,255)), 7
          $textBrush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::White)
          $g.FillEllipse($bg,4,4,120,120)
          $g.DrawArc($ring,22,22,84,84,25,310)
          $font = New-Object System.Drawing.Font 'Segoe UI', 30, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)
          $format = New-Object System.Drawing.StringFormat
          $format.Alignment = [System.Drawing.StringAlignment]::Center
          $format.LineAlignment = [System.Drawing.StringAlignment]::Center
          $g.DrawString('AC',$font,$textBrush,(New-Object System.Drawing.RectangleF 0,0,128,128),$format)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = [System.IO.File]::Create($iconPath)
          try { $icon.Save($stream) } finally { $stream.Dispose() }
          $font.Dispose(); $textBrush.Dispose(); $ring.Dispose(); $bg.Dispose(); $g.Dispose(); $bmp.Dispose()

          $desktop = [Environment]::GetFolderPath('Desktop')
          if (-not $desktop) { throw 'Desktop folder could not be resolved.' }
          $shortcutPath = Join-Path $desktop 'Agent Control.lnk'
          $wsh = New-Object -ComObject WScript.Shell
          $shortcut = $wsh.CreateShortcut($shortcutPath)
          $shortcut.TargetPath = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $shortcut.Arguments = "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$launcher`""
          $shortcut.WorkingDirectory = $agentDir
          $shortcut.Description = 'Open MHW Agent Control Panel'
          $shortcut.IconLocation = "$iconPath,0"
          $shortcut.Save()

          if (-not (Test-Path -LiteralPath $shortcutPath)) { throw 'Shortcut was not created.' }
          $verify = $wsh.CreateShortcut($shortcutPath)
          if ($verify.IconLocation -notlike "$iconPath*") { throw 'Shortcut icon verification failed.' }
          Write-Host "SHORTCUT_CREATED=$shortcutPath"
          Write-Host "AGENT_CONTROL_REPO=$repo"
