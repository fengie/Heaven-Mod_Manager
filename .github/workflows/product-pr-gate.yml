name: Product PR Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'MhwModManager.sln'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/product-pr-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Verify product changes on Heaven
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $required = '10.0.401'
          $actual = (& dotnet --version).Trim()
          if ($actual -ne $required) { throw "Expected .NET SDK $required, got $actual" }
      - name: Restore
        shell: powershell
        run: dotnet restore .\MhwModManager.sln -m:1 -nr:false
      - name: Build
        shell: powershell
        run: dotnet build .\MhwModManager.sln -c Release --no-restore -m:1 -nr:false
      - name: Test
        shell: powershell
        run: |
          # xUnit v3 projects are executable Microsoft.Testing.Platform runners.
          # Execute those runners directly on Heaven; dotnet test on SDK 10.0.401
          # is currently returning discovery exit 5 despite successful builds.
          $runners = @(
            '.\tests\MhwModManager.Tests\bin\Release\net10.0\MhwModManager.Tests.exe',
            '.\tests\MhwModManager.AutomationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.AutomationTests.exe',
            '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          )
          foreach ($runner in $runners) {
            if (-not (Test-Path -LiteralPath $runner)) { throw "Missing built test runner: $runner" }
            & $runner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Diff check
        shell: powershell
        run: git diff --check
