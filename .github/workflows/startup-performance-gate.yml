name: Startup Performance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/MhwModManager.App/**'
      - 'src/MhwModManager.Automation/**'
      - 'src/MhwModManager.Storage/**'
      - 'src/MhwModManager.Filesystem/**'
      - 'src/MhwModManager.Core/**'
      - 'tests/MhwModManager.AutomationTests/StartupMaintenanceScaleTests.cs'
      - 'tests/MhwModManager.IntegrationTests/StartupPerformanceTests.cs'
      - 'scripts/diagnostics/Measure-StartupPerformance.ps1'
      - '.github/workflows/startup-performance-gate.yml'
  push:
    branches:
      - 'perf-startup-*'
      - 'fix/startup-maintenance-*'
    paths:
      - 'src/**'
      - 'tests/MhwModManager.IntegrationTests/**'
      - 'scripts/diagnostics/Measure-StartupPerformance.ps1'
      - '.github/workflows/startup-performance-gate.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'VERSION.txt'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Compare main vs candidate (isolated Windows)
    # PR code executes on disposable hosted Windows, never an owner's self-hosted machine.
    # Trusted owner-branch/manual runs can use the existing Heaven benchmark runner.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '"windows-2025"' || '["self-hosted","Windows","X64","mhw-mods"]') }}
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out current main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Provision pinned .NET SDK on either runner
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: candidate/global.json

      - name: Verify pinned .NET SDK
        working-directory: candidate
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') { throw "Startup performance gate requires .NET SDK 10.0.401; found $version." }

      - name: Restore and build baseline
        working-directory: baseline
        shell: powershell
        run: |
          dotnet restore .\src\MhwModManager.App\MhwModManager.App.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\MhwModManager.App\MhwModManager.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and build candidate
        working-directory: candidate
        shell: powershell
        run: |
          dotnet restore .\src\MhwModManager.App\MhwModManager.App.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\src\MhwModManager.App\MhwModManager.App.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure current main baseline
        shell: powershell
        run: |
          .\candidate\scripts\diagnostics\Measure-StartupPerformance.ps1 -RepositoryRoot .\baseline -OutputPath BuildLogs\startup-performance-baseline.json -ColdIterations 3 -WarmIterations 5 -ModCount 300 -FilesPerMod 25 -InboxPackages 12 -FilesPerInboxPackage 20 -TimeoutSeconds 120

      - name: Measure candidate
        shell: powershell
        run: |
          .\candidate\scripts\diagnostics\Measure-StartupPerformance.ps1 -RepositoryRoot .\candidate -OutputPath BuildLogs\startup-performance-candidate.json -ColdIterations 3 -WarmIterations 5 -ModCount 300 -FilesPerMod 25 -InboxPackages 12 -FilesPerInboxPackage 20 -TimeoutSeconds 120

      - name: Build before-after report
        shell: powershell
        run: |
          $baseline = Get-Content .\baseline\BuildLogs\startup-performance-baseline.json -Raw | ConvertFrom-Json
          $candidate = Get-Content .\candidate\BuildLogs\startup-performance-candidate.json -Raw | ConvertFrom-Json

          function Improvement([double]$before, [double]$after) {
              if ($before -eq 0) { return 'N/A' }
              return ('{0:F1}%' -f ((($before - $after) / $before) * 100))
          }

          $metrics = @(
              'process_to_ready_ms',
              'session_to_main_window_show_ms',
              'session_to_ready_ms',
              'cpu_ms',
              'peak_working_set_mb',
              'idle_working_set_mb',
              'catalog_refresh_ms',
              'armor_import_ms',
              'nexus_refresh_ms',
              'game_build_ms',
              'recovery_ms',
              'automation_ms',
              'main_window_initialize_ms',
              'master_log_mb'
          )
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('## Startup performance comparison')
          $lines.Add('')
          $lines.Add("Baseline: $($baseline.source_sha)")
          $lines.Add("Candidate: $($candidate.source_sha)")
          $lines.Add("Fixture: $($candidate.mod_count) mods / $($candidate.total_mod_files) indexed files plus $($candidate.inbox_packages) pending folder packages; 3 cold-state + 5 warm-state runs each on the same Heaven runner.")
          $lines.Add('')
          $lines.Add('| Metric | Main cold | Candidate cold | Cold improvement | Main warm | Candidate warm | Warm improvement |')
          $lines.Add('|---|---:|---:|---:|---:|---:|---:|')
          foreach ($metric in $metrics) {
              $bc = [double]$baseline.cold.$metric
              $cc = [double]$candidate.cold.$metric
              $bw = [double]$baseline.warm.$metric
              $cw = [double]$candidate.warm.$metric
              $lines.Add("| $metric | $bc | $cc | $(Improvement $bc $cc) | $bw | $cw | $(Improvement $bw $cw) |")
          }
          $lines.Add('')
          $lines.Add("Build-output size: main $($baseline.package_size_mb) MB; candidate $($candidate.package_size_mb) MB.")
          $lines.Add('')
          $lines.Add('_Cold-state resets manager state/database but does not claim a flushed Windows filesystem cache. Positive percentages mean lower/faster._')
          $report = $lines -join [Environment]::NewLine
          Set-Content -LiteralPath .\startup-performance-comparison.md -Value $report -Encoding UTF8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report

          # This is a gate, not merely a comparison report: flag median startup
          # latency regressions on the same dedicated runner, allowing for noise.
          $violations = New-Object System.Collections.Generic.List[string]
          foreach ($kind in @('cold', 'warm')) {
              $before = [double]$baseline.$kind.process_to_ready_ms
              $after = [double]$candidate.$kind.process_to_ready_ms
              $ceiling = [math]::Max($before * 1.25, $before + 1000)
              if ($after -gt $ceiling) {
                  $violations.Add("$kind process-to-ready: $after ms exceeds $([math]::Round($ceiling,1)) ms baseline-relative budget")
              }
          }
          if ([double]$candidate.cold.process_to_ready_ms -gt 30000) {
              $violations.Add("Cold startup median exceeds 30000 ms scenario budget")
          }
          if ([double]$candidate.warm.process_to_ready_ms -gt 15000) {
              $violations.Add("Warm startup median exceeds 15000 ms scenario budget")
          }
          if ($violations.Count -gt 0) {
              throw ("Startup performance regression detected: " + ($violations -join '; '))
          }

      - name: Verify startup optimization guards
        working-directory: candidate
        shell: powershell
        run: |
          dotnet test .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --filter "FullyQualifiedName~DebugTraceCoverageTests|FullyQualifiedName~HiddenSecondaryPagesAreLazyLoadedAfterStartup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run exact release verification on candidate
        working-directory: candidate
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\\scripts\\release\\Verify-Release.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check origin/main...HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve startup benchmark evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-performance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
          path: |
            baseline/BuildLogs/startup-performance-baseline.json
            candidate/BuildLogs/startup-performance-candidate.json
            startup-performance-comparison.md
