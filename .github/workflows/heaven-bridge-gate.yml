name: Heaven Local Bridge Gate

on:
  push:
    branches:
      - heaven-bridge
    paths:
      - 'heaven-bridge/worker.py'
      - 'heaven-bridge/bootstrap.ps1'
      - 'heaven-bridge/test_worker.py'
      - 'heaven-bridge/tests/**'
      - '.github/workflows/heaven-bridge-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact bridge source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile bridge Python
        shell: pwsh
        run: |
          python -m py_compile heaven-bridge/worker.py heaven-bridge/test_worker.py

      - name: Run bridge worker tests
        shell: pwsh
        run: |
          python heaven-bridge/test_worker.py

      - name: Parse bootstrap PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'heaven-bridge/bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
