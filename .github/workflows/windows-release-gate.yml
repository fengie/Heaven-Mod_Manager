name: Windows Release Gate

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/windows-release-gate.yml'
      - 'legacy-v7/**'
      - 'MhwModManager.sln'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'NuGet.config'
      - 'global.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'VERSION.txt'
      - 'VALIDATION.md'
      - 'Open Startup Logs.bat'
      - 'OPEN MASTER DEBUG LOG.bat'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-main
  cancel-in-progress: true

jobs:
  windows-release:
    name: Verify, publish, and prove update on Heaven
    # GitHub-hosted Windows currently fails before runner allocation; use the repaired Heaven runner.
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 90

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven release runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Record runner provenance
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path BuildLogs | Out-Null
          @(
            "github_sha=$env:GITHUB_SHA"
            "github_ref=$env:GITHUB_REF"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "dotnet_sdk=$(& dotnet --version)"
            "powershell_5=$(& powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          ) | Set-Content -Path BuildLogs\ci-windows-provenance.txt -Encoding UTF8

      - name: Run exact repository verification gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Verify-Release.ps1"

      - name: Run exact release build and publish gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Build-Release.ps1"

      - name: Test updater publication policy
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Test-UpdaterReleasePolicy.ps1"

      - name: Publish immutable updater release
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\Publish-UpdaterRelease.ps1 -ManifestPath ".\artifacts\update-manifest.json"

      - name: Build installed-client updater E2E
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real build-60 update and rollback against published release
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          MHW_RUN_UPDATER_INSTALLED_E2E: '1'
          MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
          MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}\BuildLogs\updater-installed-e2e\evidence.json
        run: |
          $manifestPath = '.\artifacts\update-manifest.json'
          if (!(Test-Path -LiteralPath $manifestPath)) { throw "Published updater manifest is missing: $manifestPath" }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([long]$manifest.buildNumber -le 60) {
            throw "Published updater build must be newer than 60; found $($manifest.buildNumber)."
          }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.sourceSha)) {
            throw 'Published updater manifest is missing sourceSha.'
          }
          if (-not [string]::Equals([string]$manifest.sourceSha, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Published updater source $($manifest.sourceSha) does not match exact workflow source $env:GITHUB_SHA."
          }

          $env:MHW_E2E_TARGET_BUILD = [string]$manifest.buildNumber
          $env:MHW_E2E_TARGET_SOURCE = [string]$manifest.sourceSha
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) { throw "Missing test runner: $runner" }
          $stdout = Join-Path $evidence 'installed-client-e2e.stdout.log'
          $stderr = Join-Path $evidence 'installed-client-e2e.stderr.log'
          $combined = Join-Path $evidence 'installed-client-e2e-test.log'
          Remove-Item -LiteralPath $stdout,$stderr,$combined -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $runner `
            -ArgumentList @('--filter-class', 'MhwModManager.IntegrationTests.UpdaterInstalledClientE2ETests') `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          @('=== STDOUT ===') | Set-Content -LiteralPath $combined -Encoding UTF8
          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | Add-Content -LiteralPath $combined }
          @('=== STDERR ===') | Add-Content -LiteralPath $combined
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | Add-Content -LiteralPath $combined }

          if ($process.ExitCode -ne 0) {
            throw "Installed-client updater E2E failed with exit code $($process.ExitCode). See $combined."
          }
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Installed-client updater E2E returned success without evidence.json.'
          }
          $doc = Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($doc.status -eq 'FAIL' -or $doc.scenarioA.status -ne 'PASS' -or $doc.scenarioB.status -ne 'PASS') {
            throw 'Installed-client updater E2E evidence is not fully green.'
          }

      - name: Preserve verification, build, and promoted-cache evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-evidence-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            BuildLogs/**
            artifacts/**
            release/**
            .verification/function-status.json
            .verification/stage-status.json
            MHW-DEBUG-ALL.log

      - name: Persist promoted verification state
        if: success() && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          # Verification evidence is exact-input data. Never replay a stale run's promoted
          # cache/evidence commit on top of a newer main revision.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/main before persisting verification state.'
          }
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:GITHUB_SHA) {
            Write-Host "::notice::Skipping verification-state persistence for $env:GITHUB_SHA because main advanced to $remoteMain while this exact gate was running. Exact evidence remains in the uploaded artifact."
            exit 0
          }

          $verify = Get-ChildItem -Path BuildLogs -Filter 'verification-report-*.md' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $build = Get-ChildItem -Path BuildLogs -Filter 'build-release-report-*.txt' | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $verify -or -not $build) { throw 'Expected verification/build reports were not produced.' }

          $releaseVersion = (Get-Content -LiteralPath 'VERSION.txt' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseVersion)) { throw 'VERSION.txt is empty.' }
          $evidencePath = "_AGENT_CONTEXT/EVIDENCE/v$releaseVersion-heaven-windows-closure.log"
          @(
            ("MHW Manual Mod Manager v$releaseVersion Heaven Windows closure")
            ('source_sha=' + $env:GITHUB_SHA)
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('runner_os=' + $env:RUNNER_OS)
            ('runner_arch=' + $env:RUNNER_ARCH)
            ('dotnet_sdk=' + (& dotnet --version))
            ''
            '=== VERIFICATION REPORT ==='
            (Get-Content -LiteralPath $verify.FullName -Raw)
            ''
            '=== RELEASE BUILD REPORT ==='
            (Get-Content -LiteralPath $build.FullName -Raw)
          ) | Set-Content -LiteralPath $evidencePath -Encoding UTF8

          $updaterEvidenceJson = Join-Path $env:GITHUB_WORKSPACE 'BuildLogs\updater-installed-e2e\evidence.json'
          if (!(Test-Path -LiteralPath $updaterEvidenceJson)) {
            throw 'Successful release gate is missing installed-client updater E2E evidence.'
          }
          $updaterEvidenceHash = (Get-FileHash -LiteralPath $updaterEvidenceJson -Algorithm SHA256).Hash
          $updaterClosurePath = "_AGENT_CONTEXT/EVIDENCE/updater-installed-client-e2e-v$releaseVersion.log"
          @(
            ("MHW Manual Mod Manager v$releaseVersion installed-client updater E2E closure")
            ('source_sha=' + $env:GITHUB_SHA)
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('runner_os=' + $env:RUNNER_OS)
            ('runner_arch=' + $env:RUNNER_ARCH)
            ('dotnet_sdk=' + (& dotnet --version))
            ('evidence_sha256=' + $updaterEvidenceHash)
            ''
            '=== EVIDENCE.JSON ==='
            (Get-Content -LiteralPath $updaterEvidenceJson -Raw)
          ) | Set-Content -LiteralPath $updaterClosurePath -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.verification/function-status.json' '.verification/stage-status.json' $evidencePath $updaterClosurePath
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Persist Heaven release and updater evidence [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the verification evidence commit.' }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              # A concurrent main update between the preflight fetch and this push is benign:
              # this run's exact evidence was already uploaded and must not be rebased forward.
              git fetch origin main
              if ($LASTEXITCODE -ne 0) {
                throw 'Verification evidence was produced, but the failed push could not be diagnosed because origin/main could not be fetched.'
              }
              $remoteMain = (git rev-parse origin/main).Trim()
              if ($remoteMain -ne $env:GITHUB_SHA) {
                Write-Host "::notice::Skipping the local persistence commit because main advanced to $remoteMain during the push race. Exact evidence remains in the uploaded artifact."
                exit 0
              }
              throw "Failed to persist verification state while origin/main still points at exact source $env:GITHUB_SHA."
            }
          } else {
            Write-Host 'Promoted verification state already matches the repository.'
          }
