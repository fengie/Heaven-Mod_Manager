name: Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete provably redundant remote branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          OWNER="${GITHUB_REPOSITORY%%/*}"
          : > /tmp/deleted.txt
          : > /tmp/retained.txt

          mapfile -t BRANCHES < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ |
              grep -v '^HEAD$' |
              grep -v '^main$' |
              sort
          )

          STARTING_COUNT="${#BRANCHES[@]}"

          for b in "${BRANCHES[@]}"; do
            reason=""

            # Patch-equivalent history: no commit on the branch contributes a
            # patch that main does not already contain.
            if ! git cherry origin/main "origin/$b" | grep -q '^+'; then
              reason="patch-equivalent-to-main"
            else
              # Exact branch provenance: a PR whose head is this branch was
              # actually merged. This remains safe for non-main PR bases too:
              # the merged base retains the work, and any later deletion of
              # that base is independently subject to the same proof.
              merged_count="$(
                gh api -X GET --paginate "repos/$GITHUB_REPOSITORY/pulls"                   -f state=closed                   -f head="$OWNER:$b"                   -f per_page=100                   --jq '[.[] | select(.merged_at != null)] | length' |
                  awk '{s += $1} END {print s + 0}'
              )"
              if [ "$merged_count" -gt 0 ]; then
                reason="merged-pr"
              fi
            fi

            if [ -n "$reason" ]; then
              if git push origin --delete "$b"; then
                printf '%s\t%s\n' "$b" "$reason" >> /tmp/deleted.txt
              else
                printf '%s\t%s\n' "$b" "delete-failed" >> /tmp/retained.txt
              fi
            else
              unique_count="$(git cherry origin/main "origin/$b" | grep -c '^+' || true)"
              printf '%s\t%s\n' "$b" "unique-patches:$unique_count" >> /tmp/retained.txt
            fi
          done

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          ENDING_COUNT="$(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ |
              grep -v '^HEAD$' |
              grep -v '^main$' |
              wc -l |
              tr -d ' '
          )"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          def read_rows(path):
              rows = []
              p = Path(path)
              if not p.exists():
                  return rows
              for line in p.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  branch, reason = (line.split("\t", 1) + [""])[:2]
                  rows.append({"branch": branch, "reason": reason})
              return rows

          report = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "canonical_branch": "main",
              "starting_non_main_branch_count": int(os.environ["STARTING_COUNT"]),
              "deleted": read_rows("/tmp/deleted.txt"),
              "retained": read_rows("/tmp/retained.txt"),
              "ending_non_main_branch_count": int(os.environ["ENDING_COUNT"]),
          }
          Path(".branch-hygiene").mkdir(exist_ok=True)
          Path(".branch-hygiene/report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          PY
        env:
          STARTING_COUNT: ${{ env.STARTING_COUNT }}
          ENDING_COUNT: ${{ env.ENDING_COUNT }}

      - name: Publish cleanup report to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .branch-hygiene/report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record branch hygiene cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
