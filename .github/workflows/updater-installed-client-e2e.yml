name: Updater Installed Client E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/updater-installed-client-e2e.yml'
      - 'tests/MhwModManager.IntegrationTests/MhwModManager.IntegrationTests.csproj'
      - 'tests/MhwModManager.IntegrationTests/UpdaterInstalledClientE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdateInstallerTests.cs'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'src/MhwModManager.App/App.xaml.cs'
  pull_request:
    paths:
      - '.github/workflows/updater-installed-client-e2e.yml'
      - 'tests/MhwModManager.IntegrationTests/UpdaterInstalledClientE2ETests.cs'
      - 'tests/MhwModManager.IntegrationTests/UpdateInstallerTests.cs'
      - 'src/MhwModManager.Updater/**'
      - 'src/MhwModManager.Updater.Helper/**'
      - 'src/MhwModManager.App/App.xaml.cs'

permissions:
  contents: write

jobs:
  bom-regression-on-heaven:
    name: Validate updater BOM fix on Heaven
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '0'
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
      - name: Restore integration tests
        shell: powershell
        run: dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -p:NuGetAudit=false
      - name: Build integration tests
        shell: powershell
        run: dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
      - name: Run integration suite with live updater E2E disabled
        shell: powershell
        run: |
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) { throw "Missing test runner: $runner" }
          & $runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  installed-client-e2e:
    name: Real packaged 60 to 61 update and rollback
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      MHW_RUN_UPDATER_INSTALLED_E2E: '1'
      MHW_MOD_MANAGER_GITHUB_TOKEN: ${{ github.token }}
      MHW_E2E_EVIDENCE_PATH: ${{ github.workspace }}\BuildLogs\updater-installed-e2e\evidence.json

    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Prepare evidence directory
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          @(
            "candidate_sha=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "dotnet_sdk=$(& dotnet --version)"
            "run_opt_in=$env:MHW_RUN_UPDATER_INSTALLED_E2E"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'provenance.txt') -Encoding UTF8
          if ($env:MHW_RUN_UPDATER_INSTALLED_E2E -ne '1') {
            throw 'Updater installed-client E2E opt-in is not active.'
          }
          if ([string]::IsNullOrWhiteSpace($env:MHW_MOD_MANAGER_GITHUB_TOKEN)) {
            throw 'Repository token was not supplied to the updater E2E.'
          }

      - name: Restore integration test project
        shell: powershell
        run: |
          dotnet restore .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build integration test project
        shell: powershell
        run: |
          dotnet build .\tests\MhwModManager.IntegrationTests\MhwModManager.IntegrationTests.csproj -c Release --no-restore -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full integration suite including updater E2E and ownership regressions
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $log = Join-Path $evidence 'runtime-ownership-tests.log'
          $runner = '.\tests\MhwModManager.IntegrationTests\bin\Release\net10.0-windows10.0.19041.0\MhwModManager.IntegrationTests.exe'
          if (!(Test-Path -LiteralPath $runner)) {
            throw "Built xUnit v3 integration runner is missing: $runner"
          }
          & $runner 2>&1 |
            Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { exit $exit }
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Full integration suite returned success without producing updater E2E evidence.json.'
          }
          Copy-Item -LiteralPath $log -Destination (Join-Path $evidence 'installed-client-e2e-test.log') -Force

      - name: Verify updater success and rollback evidence
        shell: powershell
        run: |
          $evidenceDir = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $log = Join-Path $evidenceDir 'rollback-regression-tests.log'
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Updater E2E evidence.json is missing.'
          }
          $doc = Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw | ConvertFrom-Json
          if ($doc.status -eq 'FAIL') {
            throw "Updater E2E evidence reports failure: $($doc.failureType): $($doc.failureMessage)"
          }
          if ($doc.scenarioA.status -ne 'PASS') {
            throw "Installed-client update scenario did not pass: $($doc.scenarioA.status)"
          }
          if ($doc.scenarioB.status -ne 'PASS') {
            throw "Injected rollback scenario did not pass: $($doc.scenarioB.status)"
          }
          @(
            'full_integration_suite=PASS'
            ('scenarioA=' + $doc.scenarioA.status)
            ('scenarioB=' + $doc.scenarioB.status)
            ('restoredBuild=' + $doc.scenarioB.restoredBuild)
            ('restoredSource=' + $doc.scenarioB.restoredSource)
          ) | Set-Content -LiteralPath $log -Encoding UTF8

      - name: Collect updater runtime log
        if: always()
        shell: powershell
        run: |
          $evidence = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $runtimeLog = Join-Path $env:LOCALAPPDATA 'MhwModManager\Updater\updater.log'
          if (Test-Path -LiteralPath $runtimeLog) {
            Copy-Item -LiteralPath $runtimeLog -Destination (Join-Path $evidence 'updater-runtime.log') -Force
          }

      - name: Upload installed-client E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-installed-client-e2e-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ github.workspace }}\BuildLogs\updater-installed-e2e\**

      - name: Persist successful installed-client E2E evidence
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: powershell
        run: |
          if (!(Test-Path -LiteralPath $env:MHW_E2E_EVIDENCE_PATH)) {
            throw 'Successful updater E2E did not produce evidence.json.'
          }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to fetch origin/main before persisting updater E2E evidence.'
          }
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:GITHUB_SHA) {
            Write-Host "::notice::Skipping updater E2E evidence persistence for $env:GITHUB_SHA because main advanced to $remoteMain. The exact evidence remains in the workflow artifact."
            exit 0
          }

          $evidenceDir = Split-Path -Parent $env:MHW_E2E_EVIDENCE_PATH
          $evidenceHash = (Get-FileHash -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Algorithm SHA256).Hash
          $provenancePath = Join-Path $evidenceDir 'provenance.txt'
          $testLogPath = Join-Path $evidenceDir 'installed-client-e2e-test.log'
          $rollbackLogPath = Join-Path $evidenceDir 'rollback-regression-tests.log'
          $runtimeOwnershipLogPath = Join-Path $evidenceDir 'runtime-ownership-tests.log'
          $provenanceHash = if (Test-Path -LiteralPath $provenancePath) { (Get-FileHash -LiteralPath $provenancePath -Algorithm SHA256).Hash } else { 'missing' }
          $testLogHash = if (Test-Path -LiteralPath $testLogPath) { (Get-FileHash -LiteralPath $testLogPath -Algorithm SHA256).Hash } else { 'missing' }
          $rollbackLogHash = if (Test-Path -LiteralPath $rollbackLogPath) { (Get-FileHash -LiteralPath $rollbackLogPath -Algorithm SHA256).Hash } else { 'missing' }
          $runtimeOwnershipLogHash = if (Test-Path -LiteralPath $runtimeOwnershipLogPath) { (Get-FileHash -LiteralPath $runtimeOwnershipLogPath -Algorithm SHA256).Hash } else { 'missing' }

          $closurePath = '_AGENT_CONTEXT/EVIDENCE/updater-installed-client-e2e-v8.8.7.log'
          @(
            'MHW Manual Mod Manager v8.8.7 installed-client updater E2E closure'
            ('source_sha=' + $env:GITHUB_SHA)
            ('run_id=' + $env:GITHUB_RUN_ID)
            ('runner_os=' + $env:RUNNER_OS)
            ('runner_arch=' + $env:RUNNER_ARCH)
            ('dotnet_sdk=' + (& dotnet --version))
            ('evidence_sha256=' + $evidenceHash)
            ('provenance_sha256=' + $provenanceHash)
            ('installed_client_test_log_sha256=' + $testLogHash)
            ('rollback_regression_log_sha256=' + $rollbackLogHash)
            ('runtime_ownership_test_log_sha256=' + $runtimeOwnershipLogHash)
            ''
            '=== EVIDENCE.JSON ==='
            (Get-Content -LiteralPath $env:MHW_E2E_EVIDENCE_PATH -Raw)
          ) | Set-Content -LiteralPath $closurePath -Encoding UTF8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $closurePath
          git commit -m 'Persist updater installed-client E2E evidence [skip ci]'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create updater installed-client E2E evidence commit.'
          }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              throw 'Updater E2E evidence was produced, but the failed push could not be diagnosed.'
            }
            $remoteMain = (git rev-parse origin/main).Trim()
            if ($remoteMain -ne $env:GITHUB_SHA) {
              Write-Host "::notice::Skipping the local updater E2E evidence commit because main advanced to $remoteMain during the push race."
              exit 0
            }
            throw "Failed to persist updater E2E evidence while origin/main still points at exact source $env:GITHUB_SHA."
          }
