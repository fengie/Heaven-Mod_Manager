name: Heaven Local Bridge Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    name: Verify on Heaven self-hosted runner
    runs-on: [self-hosted, Windows, X64, heaven]
    timeout-minutes: 20
    steps:
      - name: Check out exact bridge source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile bridge Python
        shell: pwsh
        run: |
          python -m py_compile heaven-bridge/worker.py heaven-bridge/test_worker.py

      - name: Run bridge worker tests
        shell: pwsh
        run: |
          python heaven-bridge/test_worker.py
