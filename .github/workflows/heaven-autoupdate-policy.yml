name: Heaven AutoUpdate Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heaven-autoupdate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    # MHW's dedicated Heaven runner is repo-scoped; Toolbox's persistent runner is not.
    # Never execute fork-supplied private PR workflows on the persistent Windows host.
    if: github.event.repository.private == false || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Windows","X64","mhw-mods"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce automatic update contract (Windows)
        if: github.event.repository.private == true
        shell: powershell
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: .\scripts\ci\Verify-HeavenRepoPolicy.ps1
      - name: Enforce automatic update contract (Linux)
        if: github.event.repository.private == false
        shell: pwsh
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: ./scripts/ci/Verify-HeavenRepoPolicy.ps1
