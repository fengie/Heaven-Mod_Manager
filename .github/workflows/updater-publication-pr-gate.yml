name: Updater Publication PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/Publish-UpdaterRelease.ps1'
      - 'scripts/Publish-PublicUpdaterRelease.ps1'
      - 'scripts/UpdaterReleasePublication.ps1'
      - 'scripts/UpdaterReleasePolicy.ps1'
      - 'scripts/Test-UpdaterReleasePolicy.ps1'
      - '.github/workflows/updater-publication-pr-gate.yml'

permissions:
  contents: read

concurrency:
  group: updater-publication-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publication-policy:
    name: Verify updater publication exact source
    # GitHub-hosted Windows can fail before runner allocation; use the repaired Heaven runner.
    runs-on: [self-hosted, Windows, X64, mhw-mods]
    timeout-minutes: 90
    env:
      MHW_UPDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      MHW_UPDATE_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify pinned .NET SDK
        shell: powershell
        run: |
          $version = (& dotnet --version).Trim()
          if ($version -ne '10.0.401') {
            throw "Heaven updater publication runner requires .NET SDK 10.0.401; found $version."
          }

      - name: Assert exact checked-out source
        shell: powershell
        run: |
          $head=(git rev-parse HEAD).Trim()
          if ($head -ne '${{ github.event.pull_request.head.sha }}') {
            throw "Checked-out source $head does not match PR head ${{ github.event.pull_request.head.sha }}."
          }

      - name: Parse public updater mirror script
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\Publish-PublicUpdaterRelease.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw 'Publish-PublicUpdaterRelease.ps1 contains PowerShell parse errors.'
          }
          if(Select-String -LiteralPath '.\scripts\Publish-PublicUpdaterRelease.ps1' -Pattern 'Get-Command gh|& gh ' -Quiet) {
            throw 'Public updater mirroring must not depend on GitHub CLI on Heaven.'
          }

      - name: Run updater publication policy and fault tests
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Test-UpdaterReleasePolicy.ps1"

      - name: Run exact repository verification gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Verify-Release.ps1"

      - name: Run exact release build and package gate
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Build-Release.ps1"

      - name: Run continuity handoff check
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\Test-AgentHandoff.ps1"

      - name: Preserve PR verification evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: updater-publication-pr-evidence-${{ github.event.pull_request.head.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            BuildLogs/**
            artifacts/**
            release/**
            .verification/function-status.json
            .verification/stage-status.json
            MHW-DEBUG-ALL.log
