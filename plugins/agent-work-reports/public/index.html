<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Work Reports</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0e14; --panel:#121722; --panel2:#171e2b; --line:#263043; --text:#eef3fb; --muted:#98a6bb; --ok:#52d273; --warn:#f2b84b; --bad:#ff6b72; --accent:#7aa2ff; --radius:14px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); }
    button,input,select { font:inherit; }
    button { color:inherit; }
    .shell { max-width:1600px; margin:auto; padding:18px; }
    header { display:flex; gap:14px; align-items:center; justify-content:space-between; margin-bottom:14px; }
    h1 { font-size:24px; margin:0; letter-spacing:-.02em; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .control { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 11px; }
    button.control { cursor:pointer; }
    button.control:hover { border-color:#50627f; }
    .stats { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:10px; margin-bottom:12px; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; min-width:0; }
    .stat strong { display:block; font-size:24px; line-height:1.1; }
    .stat span { color:var(--muted); font-size:12px; }
    .layout { display:grid; grid-template-columns:minmax(420px, .95fr) minmax(520px, 1.35fr); gap:12px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; min-width:0; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:15px; }
    .panel-head small { color:var(--muted); }
    .rows { max-height:72vh; overflow:auto; }
    .row { border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .row-main { width:100%; background:transparent; border:0; color:inherit; text-align:left; cursor:pointer; padding:11px 13px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; }
    .row-main:hover { background:var(--panel2); }
    .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 3px rgba(255,255,255,.03); }
    .dot.active { background:var(--ok); } .dot.blocked { background:var(--bad); } .dot.queued { background:var(--warn); } .dot.done { background:#708096; }
    .title { font-size:13px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta { margin-top:3px; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pct { font-size:12px; color:var(--muted); min-width:36px; text-align:right; }
    .bar { height:3px; background:#20293a; }
    .bar > i { display:block; height:100%; width:0; background:var(--accent); }
    .details { display:none; padding:0 14px 13px 32px; color:#c9d2df; font-size:12px; line-height:1.45; }
    .row.open .details { display:block; }
    .detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 14px; margin:9px 0; }
    .detail-grid b { color:var(--muted); font-weight:500; }
    .summary { margin:8px 0; white-space:pre-wrap; word-break:break-word; }
    .agents { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; padding:10px; max-height:72vh; overflow:auto; }
    .agent { border:1px solid var(--line); background:var(--panel2); border-radius:12px; min-width:0; }
    .agent-head { width:100%; border:0; background:transparent; color:inherit; cursor:pointer; padding:11px; text-align:left; display:flex; gap:9px; align-items:flex-start; }
    .agent-head:hover { background:rgba(255,255,255,.025); }
    .agent-body { display:none; padding:0 11px 11px; font-size:12px; color:#cbd4e1; }
    .agent.open .agent-body { display:block; }
    .agent-name { font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .agent-task { color:var(--muted); font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pill { display:inline-block; padding:2px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:10px; margin:4px 4px 0 0; }
    .log { margin-top:8px; width:100%; }
    .log-output { display:none; max-height:240px; overflow:auto; background:#090c12; border:1px solid var(--line); border-radius:9px; padding:9px; white-space:pre-wrap; word-break:break-word; color:#b9c7d9; font:11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .log-output.show { display:block; }
    .activity { margin-top:12px; }
    details.activity summary { cursor:pointer; padding:11px 14px; color:var(--muted); }
    .activity-list { max-height:260px; overflow:auto; border-top:1px solid var(--line); }
    .activity-item { padding:8px 14px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:130px 120px minmax(0,1fr); gap:8px; font-size:11px; }
    .activity-item time,.activity-item .kind { color:var(--muted); }
    .empty { padding:24px; text-align:center; color:var(--muted); font-size:13px; }
    .source { font-size:11px; color:var(--muted); }
    .source.bad { color:var(--bad); }
    @media (max-width:1050px) { .stats { grid-template-columns:repeat(3,1fr); } .layout { grid-template-columns:1fr; } .rows,.agents { max-height:none; } }
    @media (max-width:620px) { .shell { padding:10px; } header { align-items:flex-start; flex-direction:column; } .stats { grid-template-columns:repeat(2,1fr); } .agents { grid-template-columns:1fr; } .activity-item { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Agent Work Reports</h1>
        <div class="sub">All agent work in one glance. Click any work item or agent for details.</div>
      </div>
      <div class="toolbar">
        <input id="search" class="control" type="search" placeholder="Search work or agents" autocomplete="off" />
        <select id="filter" class="control" aria-label="Status filter"><option value="all">All statuses</option><option value="active">Active</option><option value="blocked">Blocked</option><option value="queued">Queued</option><option value="done">Done</option></select>
        <button id="refresh" class="control" type="button">Refresh now</button>
      </div>
    </header>

    <div id="source" class="source">Loading…</div>
    <section id="stats" class="stats" aria-label="Summary"></section>

    <main class="layout">
      <section class="panel">
        <div class="panel-head"><h2>Overall work</h2><small id="workCount"></small></div>
        <div id="work" class="rows"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Agents</h2><small id="agentCount"></small></div>
        <div id="agents" class="agents"></div>
      </section>
    </main>

    <details class="panel activity">
      <summary>Recent activity <span id="activityCount"></span></summary>
      <div id="activity" class="activity-list"></div>
    </details>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
